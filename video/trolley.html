<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Výhybka</title>
<style>@font-face{font-family:BS;src:url(/__f/bs) format("truetype");font-weight:100 900}@font-face{font-family:IS;src:url(/__f/is) format("truetype");font-weight:100 900}@font-face{font-family:PM;src:url(/__f/pm) format("truetype");font-weight:600}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd4f2}canvas{display:block}
#bub{position:fixed;left:0;top:0;z-index:60;transform:translate(-50%,-100%);pointer-events:none;opacity:0}
#bub .b{position:relative;background:#fff;border:7px solid #1e2a33;border-radius:44px;padding:28px 38px;font:800 58px/1.08 IS,sans-serif;color:#1e2a33;width:760px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.3)}
#bub .b:after{content:"";position:absolute;left:var(--tx,50%);bottom:-46px;width:0;height:0;border:26px solid transparent;border-top:40px solid #1e2a33;transform:translateX(-50%)}
#bub .b:before{content:"";position:absolute;left:var(--tx,50%);bottom:-30px;width:0;height:0;border:18px solid transparent;border-top:28px solid #fff;transform:translateX(-50%);z-index:2}
#bub y{color:#d4361f}
.tag3{position:fixed;left:0;top:0;z-index:55;transform:translate(-50%,-100%);font:900 64px/1 BS,sans-serif;text-transform:uppercase;color:#fff;padding:16px 30px;border-radius:22px;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;white-space:nowrap}
</style></head><body>
<div id="flash" style="position:fixed;inset:0;background:#fff;z-index:58;opacity:0;pointer-events:none"></div>
<div id="bub"><div class="b" id="bubT"></div></div>
<div class="tag3" id="tagL" style="background:#c99a1e">💰 Milionář</div>
<div class="tag3" id="tagR" style="background:#2f6f9f">👥 20 lidí</div>
<script src="/three.min.js"></script>
<script>
Promise.all([document.fonts.load('900 92px BS'),document.fonts.load('800 58px IS')]).then(()=>{
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,W/H,.1,900);
// obloha
{const c=document.createElement('canvas');c.width=4;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);
 gr.addColorStop(0,'#4f9fe0');gr.addColorStop(.55,'#9fd4f2');gr.addColorStop(1,'#e8f4ec');g.fillStyle=gr;g.fillRect(0,0,4,512);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t}
scene.fog=new THREE.Fog(0xd8ecf0,70,260);
scene.add(new THREE.HemisphereLight(0xdff1ff,0x5d7d45,.75));
const sun=new THREE.DirectionalLight(0xfff0d8,1.05);sun.position.set(-30,50,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:150});sun.shadow.bias=-.0006;scene.add(sun);scene.add(sun.target);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.75,metalness:0,flatShading:true},o));
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d),cyl=(a,b,h,s=12)=>new THREE.CylinderGeometry(a,b,h,s),sph=(r,a=12,b=8)=>new THREE.SphereGeometry(r,a,b);
function mesh(g,m,x=0,y=0,z=0,cast=true){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;return o}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const rnd=(s=>()=>((s=Math.imul(s^s>>>15,s|1)^(s+Math.imul(s^s>>>7,s|61)),((s^s>>>14)>>>0)/4294967296)))(12345);

/* ---------- zem ---------- */
const grassTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#6fa552';g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){g.fillStyle=`rgba(${40+Math.random()*60|0},${110+Math.random()*70|0},${40+Math.random()*40|0},.35)`;g.fillRect(Math.random()*w,Math.random()*h,2,5)}});
grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(60,60);
{const g=mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshStandardMaterial({map:grassTex,roughness:1}),0,0,-100,false);g.rotation.x=-Math.PI/2;scene.add(g)}

/* ---------- koleje: hlavní trať a dvě větve ---------- */
// cesta: s<0 hlavní trať (z kladné k 0), s>=0 větev (side -1 vlevo, +1 vpravo z pohledu vlaku jedoucího k -z)
const BR=13;
function pathAt(side,s){ if(s<=0)return{x:0,z:-s,h:0};
  const u=Math.min(1,s/30);const f=u*u*(3-2*u);const df=s<30?(6*u-6*u*u)/30:0;
  return{x:side*BR*f,z:-s,h:Math.atan2(side*BR*df,1)} }
const railM=M(0x6b6f76,{metalness:.6,roughness:.35}),sleeperM=M(0x6b4a2a),ballastM=M(0x9a8f80,{roughness:1});
function buildTrack(side,s0,s1){const g=new THREE.Group();
  for(let s=s0;s<s1;s+=1.0){const p=pathAt(side,s+.5);const sl=mesh(box(2.7,.16,.36),sleeperM,p.x,.14,p.z);sl.rotation.y=-p.h;g.add(sl)}
  for(const off of [-.75,.75]){for(let s=s0;s<s1;s+=1){const a=pathAt(side,s),b=pathAt(side,s+1);const ax=a.x+off*Math.cos(a.h),az=a.z+off*Math.sin(a.h);const bx=b.x+off*Math.cos(b.h),bz=b.z+off*Math.sin(b.h);
    const len=Math.hypot(bx-ax,bz-az);const r=mesh(box(.12,.16,len+.02),railM,(ax+bx)/2,.3,(az+bz)/2);r.rotation.y=Math.atan2(bx-ax,bz-az);g.add(r)}}
  for(let s=s0;s<s1;s+=2){const p=pathAt(side,s+1);const bl=mesh(box(3.6,.12,2.05),ballastM,p.x,.05,p.z,false);bl.rotation.y=-p.h;g.add(bl)}
  scene.add(g);return g}
buildTrack(1,-160,0);buildTrack(-1,0,120);buildTrack(1,0,120);
// výhybkový přestavník + táhla
const leverG=new THREE.Group();leverG.position.set(4.2,0,2.2);scene.add(leverG);
leverG.add(mesh(box(2.2,.3,1.6),M(0xb9b4a8),0,.15,0));
leverG.add(mesh(box(1.1,.9,.9),M(0x3b4a5a,{metalness:.3}),0,.75,0));
leverG.add(mesh(box(1.3,.12,1.1),M(0x2b3440,{metalness:.3}),0,1.25,0));
const pivot=new THREE.Group();pivot.position.set(0,1.25,0);leverG.add(pivot);
const arm=mesh(cyl(.07,.09,2.6,10),M(0x8a8f96,{metalness:.7,roughness:.3}),0,1.3,0);pivot.add(arm);
const knob=mesh(sph(.24,16,12),M(0xd4361f,{roughness:.35}),0,2.65,0);pivot.add(knob);
// táhlo ke kolejím
leverG.add(mesh(box(3.6,.1,.12),M(0x5a5f66,{metalness:.6}),-2.2,.32,-.6));
// cedule se šipkami
const signTex=canvasTex(1024,320,(g,w,h)=>{g.fillStyle='#fffaf0';g.fillRect(0,0,w,h);g.strokeStyle='#1e2a33';g.lineWidth=14;g.strokeRect(7,7,w-14,h-14);
  g.beginPath();g.moveTo(w/2,20);g.lineTo(w/2,h-20);g.lineWidth=6;g.stroke();
  g.fillStyle='#c99a1e';g.font='900 92px "BS",sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText('◀ MILIONÁŘ',w/4,h/2+4);g.fillStyle='#2f6f9f';g.fillText('LIDI ▶',w*3/4,h/2+4)});
const sign=new THREE.Group();sign.position.set(7.4,0,-1.2);sign.rotation.y=-.35;scene.add(sign);
for(const x of [-2.2,2.2])sign.add(mesh(cyl(.09,.09,3.6,8),M(0x5a4030),x,1.8,0));
sign.add(mesh(box(5.4,1.7,.12),M(0x1e2a33),0,3.2,0));
{const p=new THREE.Mesh(new THREE.PlaneGeometry(5.2,1.62),new THREE.MeshBasicMaterial({map:signTex}));p.position.set(0,3.2,.07);sign.add(p)}

/* ---------- postavy ---------- */
const skinCols=[0xf1c9a5,0xd9a27a,0x9c6b48,0x6e4a33],hairCols=[0x2a1d14,0x6b3f22,0xc9a35a,0x1a1a1a,0xa8501f];
const shirtCols=[0xd4361f,0x2f6f9f,0x3f8a5c,0xf0a03a,0x7a4fa3,0xe24a7a,0x2b9fc2,0xc4453a,0x4a6b2a,0xffc93a];
function person(o){const g=new THREE.Group();const skin=M(o.skin),shirt=M(o.shirt),pants=M(o.pants||0x2b3440),shoe=M(0x1e1e1e);
  // tělo kreslíme vestoje (osa y), střed v pase
  g.add(mesh(cyl(.27,.3,.72,10),shirt,0,.36,0));                 // trup
  g.add(mesh(sph(.27,10,8),shirt,0,.72,0));
  for(const x of [-.13,.13]){g.add(mesh(cyl(.12,.11,.82,8),pants,x,-.4,0));g.add(mesh(box(.2,.14,.3),shoe,x,-.83,.07))}
  const head=new THREE.Group();head.position.set(0,1.0,0);g.add(head);
  head.scale.setScalar(1.35);head.add(mesh(sph(.24,14,10),skin,0,0,0));
  const hair=mesh(new THREE.SphereGeometry(.255,14,10,0,Math.PI*2,0,Math.PI*.5),M(o.hair),0,.03,-.02);hair.rotation.x=-.35;head.add(hair);
  const eye=M(0x111111);for(const x of [-.085,.085])head.add(mesh(sph(.035,8,6),eye,x,.04,.215));
  const mouth=mesh(sph(.05,8,6),M(0x5a1a14),0,-.09,.205);mouth.scale.set(1,1.4,.5);head.add(mouth);g.userData.mouth=mouth;
  const arms=[];for(const sx of [-1,1]){const sh=new THREE.Group();sh.position.set(sx*.33,.66,0);g.add(sh);
    sh.add(mesh(cyl(.085,.08,.62,8),shirt,0,-.3,0));sh.add(mesh(sph(.09,8,6),skin,0,-.64,0));arms.push(sh)}
  g.userData.arms=arms;g.userData.head=head;
  if(o.top){const hat=new THREE.Group();hat.position.set(0,.2,0);head.add(hat);const hm=M(0x151515,{roughness:.4});
    hat.add(mesh(cyl(.36,.36,.04,18),hm,0,0,0));hat.add(mesh(cyl(.22,.24,.46,18),hm,0,.24,0));hat.add(mesh(cyl(.245,.245,.08,18),M(0x8a1a1a),0,.06,0));hair.visible=false}
  if(o.mono){const mo=mesh(new THREE.TorusGeometry(.07,.012,6,16),M(0xd9a520,{metalness:.8,roughness:.25}),.085,.04,.225);head.add(mo);
    const ch=mesh(cyl(.006,.006,.35,4),M(0xd9a520,{metalness:.8}),.15,-.12,.2);ch.rotation.z=.4;head.add(ch)}
  if(o.stache){const sm=M(0xf2f2ee);for(const sx of [-1,1]){const s=mesh(sph(.07,8,6),sm,sx*.07,-.04,.22);s.scale.set(1.6,.6,.6);s.rotation.z=sx*.3;head.add(s)}}
  if(o.bow){const bm=M(0xc41e1e);for(const sx of [-1,1]){const b=mesh(cyl(0,.08,.12,4),bm,sx*.06,.78,.24);b.rotation.z=sx*Math.PI/2;g.add(b)}g.add(mesh(sph(.035,6,4),bm,0,.78,.25))}
  if(o.suit){g.add(mesh(box(.2,.5,.05),M(0xf5f5f0),0,.5,.27))}
  return g}
const ropeM=M(0xc9a66b,{roughness:.95});
// položí postavu napříč kolejí a přiváže ji
function tie(p,side,s){const tp=pathAt(side,s);const G=new THREE.Group();G.add(p);
  p.rotation.set(-Math.PI/2,0,0);            // na záda, hlava k -z (lokálně)
  const L=new THREE.Group();L.add(G);G.scale.setScalar(1.25);L.rotation.y=Math.PI/2-tp.h;L.position.set(tp.x,.72,tp.z);scene.add(L);
  // provazy kolem hrudi, pasu a nohou + ke kolejnicím
  const ropes=[];
  for(const y of [.55,.05,-.55]){const r=mesh(new THREE.TorusGeometry(.33,.035,6,18),ropeM,0,0,0);r.rotation.x=0;r.position.set(0,y,0);r.rotation.set(Math.PI/2,0,0);p.add(r);ropes.push(r)}
  for(const y of [.7,-.7]){const c=mesh(cyl(.03,.03,.9,6),ropeM,0,0,0);c.position.set(0,y*1.07,-.25);c.rotation.x=.9;p.add(c);ropes.push(c)}
  return{L,p,tp,ropes,ry:L.rotation.y}}

// milionář vlevo
const MIL=tie(person({skin:0xf1c9a5,shirt:0x1b1d24,pants:0x1b1d24,hair:0xdedede,top:true,mono:true,stache:true,bow:true,suit:true}),-1,24);
// pytle s penězi u milionáře
const bagTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#c9a66b';g.fillRect(0,0,w,h);g.fillStyle='#2f6b2a';g.font='900 170px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('$',w/2,h/2+10)});
for(const [dx,dz,sc] of [[2.4,1.2,1],[2.9,-.4,.8],[-2.6,.8,.9]]){const p=pathAt(-1,24);const b=new THREE.Group();b.position.set(p.x+dx,0,p.z+dz);b.scale.setScalar(sc);
  b.add(mesh(sph(.6,14,10),new THREE.MeshStandardMaterial({map:bagTex,roughness:.9}),0,.55,0));b.add(mesh(cyl(.18,.28,.3,10),M(0xb08a50),0,1.15,0));b.add(mesh(new THREE.TorusGeometry(.18,.04,6,12),M(0x8a5a2a),0,1.25,0));scene.add(b)}
for(let i=0;i<14;i++){const p=pathAt(-1,24);const c=mesh(cyl(.16,.16,.04,14),M(0xf0c040,{metalness:.7,roughness:.3}),p.x+(rnd()-.5)*6,.08+rnd()*.05,p.z+(rnd()-.5)*4);c.rotation.set(rnd()*.3,0,rnd()*.3);scene.add(c)}
// 20 lidí vpravo
const PEOPLE=[];for(let i=0;i<20;i++){const pp=person({skin:skinCols[i%4],shirt:shirtCols[(i*3)%10],pants:[0x2b3440,0x4a5a7a,0x3a2a1a][i%3],hair:hairCols[(i*7)%5]});PEOPLE.push(tie(pp,1,16+i*1.32))}
// cedulka POMOC!
const helpTex=canvasTex(256,128,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);g.strokeStyle='#d4361f';g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);g.fillStyle='#d4361f';g.font='900 64px "BS",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('POMOC!',w/2,h/2+4)});
const HELP=[];for(const i of [2,7,12,17]){const tp=pathAt(1,16+i*1.32);const s=new THREE.Group();s.position.set(tp.x+2.0,0,tp.z);s.add(mesh(cyl(.04,.04,1.6,6),M(0x6b4a2a),0,.8,0));
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.55),new THREE.MeshStandardMaterial({map:helpTex,side:THREE.DoubleSide}));pl.position.y=1.6;s.add(pl);s.rotation.y=Math.PI*.15;scene.add(s);HELP.push(s)}

/* ---------- vlak ---------- */
const train=new THREE.Group();scene.add(train);
const loco=new THREE.Group();train.add(loco);   // vpředu je -z
{const green=M(0x2f6b4a,{roughness:.5,metalness:.15}),dark=M(0x1e2a24,{roughness:.6}),red=M(0xb5302a,{roughness:.5}),brass=M(0xc9973f,{metalness:.7,roughness:.3});
 loco.add(mesh(box(2.6,.5,9.2),dark,0,1.05,0));
 const boiler=mesh(cyl(1.15,1.15,5.6,20),green,0,2.35,-1.4);boiler.rotation.x=Math.PI/2;loco.add(boiler);
 for(const z of [-3.3,-1.6,.1]){const b=mesh(cyl(1.19,1.19,.14,20),brass,0,2.35,z);b.rotation.x=Math.PI/2;loco.add(b)}
 const front=mesh(cyl(1.2,1.2,.5,20),dark,0,2.35,-4.35);front.rotation.x=Math.PI/2;loco.add(front);
 const lamp=mesh(cyl(.28,.32,.3,14),M(0xfff2b0,{emissive:0xffd25a,emissiveIntensity:1.2}),0,3.0,-4.7);lamp.rotation.x=Math.PI/2;loco.add(lamp);
 loco.add(mesh(cyl(.35,.45,1.3,14),dark,0,3.95,-3.4));loco.add(mesh(cyl(.5,.38,.25,14),dark,0,4.7,-3.4));
 loco.add(mesh(sph(.48,14,10),brass,0,3.5,-1.4));
 loco.add(mesh(box(2.9,2.6,2.8),green,0,3.0,2.6));loco.add(mesh(box(3.3,.25,3.3),dark,0,4.4,2.6));
 for(const x of [-1.46,1.46])loco.add(mesh(box(.04,1,1.1),M(0xbfe6ff,{emissive:0x335566,emissiveIntensity:.3}),x,3.4,2.4));
 const cc=mesh(cyl(.05,1.5,1.2,4),red,0,.8,-5.0);cc.rotation.x=-Math.PI/2.4;cc.rotation.y=Math.PI/4;loco.add(cc);
 loco.add(mesh(box(2.8,.4,.3),red,0,1.15,-4.7));
 const wheels=[];for(const z of [-2.8,-.6,1.6])for(const x of [-1.25,1.25]){const w=mesh(cyl(.85,.85,.22,18),red,x,.85,z);w.rotation.z=Math.PI/2;loco.add(w);wheels.push(w);
   const hub=mesh(cyl(.25,.25,.26,10),dark,x,.85,z);hub.rotation.z=Math.PI/2;loco.add(hub)}
 loco.userData.wheels=wheels;
 const rod=mesh(box(.08,.12,4.6),M(0x9aa0a8,{metalness:.8}),1.42,.85,-.6);loco.add(rod);const rod2=rod.clone();rod2.position.x=-1.42;loco.add(rod2);loco.userData.rods=[rod,rod2];
}
loco.position.z=0;
const wagCols=[0xd4361f,0x2f6f9f,0x3f8a5c,0xf0a03a,0x7a4fa3,0x2b9fc2,0xc4453a,0xe24a7a];
const WAG=[];const WL=12.2;
for(let i=0;i<16;i++){const w=new THREE.Group();const col=M(wagCols[i%8],{roughness:.55});const dark=M(0x2b3440);
  w.add(mesh(box(2.8,2.5,WL-.6),col,0,2.45,0));
  w.add(mesh(box(3.1,.22,WL-.3),M(0x6b7078),0,3.8,0));w.add(mesh(box(2.4,.25,WL-.8),M(0x5a5f66),0,4.0,0));
  for(let k=0;k<5;k++)for(const x of [-1.41,1.41])w.add(mesh(box(.04,.9,1.3),M(0xfff4cc,{emissive:0xffe08a,emissiveIntensity:.35}),x,2.85,-4.4+k*2.2));
  w.add(mesh(box(2.4,.35,WL-1),dark,0,1.05,0));
  for(const z of [-4,4])for(const x of [-1.15,1.15]){const wh=mesh(cyl(.5,.5,.2,14),dark,x,.62,z);wh.rotation.z=Math.PI/2;w.add(wh)}
  w.position.z=4.5+WL/2+i*WL;train.add(w);WAG.push(w)}
// kouř
const SMOKE=[];const smokeM=new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:1,transparent:true,opacity:.85,flatShading:true});
for(let i=0;i<26;i++){const s=mesh(sph(.6,8,6),smokeM.clone(),0,-50,0,false);scene.add(s);SMOKE.push(s)}

/* ---------- krajina ---------- */
{const trunk=M(0x6b4a2a),leaf=[M(0x2f6e3c),M(0x3f8a4a),M(0x4f9a52)];
 for(let i=0;i<220;i++){const x=(rnd()-.5)*240,z=-200+rnd()*300;
   if(Math.abs(x)<9&&z>-5)continue;if(z<0&&z>-70&&(Math.abs(x+pathAt(-1,-z).x)<8||Math.abs(x-pathAt(1,-z).x)<8))continue;if(Math.abs(x)<10&&z<0&&z>-40)continue;if(Math.hypot(x-pathAt(-1,24).x,z-pathAt(-1,24).z)<14)continue;
   const s=1+rnd()*1.6;const t=new THREE.Group();t.position.set(x,0,z);t.add(mesh(cyl(.25*s,.32*s,1.6*s,6),trunk,0,.8*s,0));
   t.add(mesh(new THREE.ConeGeometry(1.8*s,3.4*s,7),leaf[i%3],0,3*s,0));t.add(mesh(new THREE.ConeGeometry(1.3*s,2.6*s,7),leaf[(i+1)%3],0,4.4*s,0));scene.add(t)}
 const hill=M(0x5f9a48);for(let i=0;i<9;i++){const h=mesh(sph(60+rnd()*40,16,10),hill,-300+i*80,-30,-260-rnd()*60,false);h.scale.y=.45;scene.add(h)}
 const cloud=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,flatShading:true});
 for(let i=0;i<10;i++){const c=new THREE.Group();c.position.set(-150+i*34,40+rnd()*25,-180-rnd()*60);for(let k=0;k<4;k++){const b=mesh(sph(5+rnd()*4,8,6),cloud,k*6-9,rnd()*2,0,false);b.scale.y=.6;c.add(b)}scene.add(c)}
}

/* ---------- ovládání ---------- */
const ease=u=>u<=0?0:u>=1?1:1-Math.pow(1-u,3),inout=u=>u<=0?0:u>=1?1:u*u*(3-2*u),lerp=(a,b,u)=>a+(b-a)*u;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
let trainZ=0,trainSpeed=0,leverA=0,shake=0,shot=null,t0=0;
const ejected=new Map();
function setTrain(z,speed,t){trainZ=z;train.position.z=z;for(const w of loco.userData.wheels)w.rotation.x=-z/.85;
  const ph=-z/.85;loco.userData.rods.forEach(r=>{r.position.y=.85+Math.sin(ph)*.25;r.position.z=-.6+Math.cos(ph)*.25});
  // kouř: obláčky vycházejí z komína a stoupají
  for(let i=0;i<SMOKE.length;i++){const s=SMOKE[i];const life=2.4;const k=((t*(1.5+speed*.08)+i/SMOKE.length*life)%life)/life;
    s.position.set(Math.sin(i*7)*.5*k,4.9+k*6,z-3.4+k*(1.5+speed*.18));s.scale.setScalar(.35+k*1.6);s.material.opacity=.8*(1-k)}}
function setLever(a){leverA=a;pivot.rotation.z=a}
function cam(p,l,fov=50){camera.position.copy(p);camera.fov=fov;camera.updateProjectionMatrix();camera.lookAt(l);
  if(shake>0){camera.position.x+=Math.sin(performance.now()*.061)*shake;camera.position.y+=Math.cos(performance.now()*.047)*shake}}
const proj=(v)=>{const q=v.clone().project(camera);return{x:(q.x*.5+.5)*W,y:(-q.y*.5+.5)*H,z:q.z}};
const bub=document.getElementById('bub'),bubT=document.getElementById('bubT'),tagL=document.getElementById('tagL'),tagR=document.getElementById('tagR');
function place(el,v,dy=0,op=1){const p=proj(v);if(el===bub){const cx=Math.max(420,Math.min(W-420,p.x));el.firstChild.style.setProperty('--tx',(380+p.x-cx)+'px');p.x=cx}el.style.left=p.x+'px';el.style.top=(p.y+dy)+'px';el.style.opacity=p.z<1?op:0}
function anim(t){ // postavy se zmítají
  const m=MIL.p;m.userData.arms.forEach((a,i)=>a.rotation.z=(i?-1:1)*(.3+.25*Math.sin(t*9+i)));m.userData.head.rotation.y=Math.sin(t*5)*.35;m.userData.mouth.scale.y=1.2+Math.abs(Math.sin(t*14))*1.4;
  MIL.L.position.y=.72+Math.abs(Math.sin(t*6))*.04;
  PEOPLE.forEach((P,i)=>{const a=P.p.userData.arms;a[0].rotation.z=.9+Math.sin(t*7+i)*.7;a[1].rotation.z=-.9-Math.sin(t*7.5+i*1.3)*.7;P.p.userData.head.rotation.y=Math.sin(t*4+i)*.4;P.p.userData.mouth.scale.y=1+Math.abs(Math.sin(t*10+i))*1.2});
  HELP.forEach((h,i)=>h.rotation.z=Math.sin(t*3+i)*.08)}

/* ---------- díl 14: vlak po větvi, zachránění lidé, peníze a cylindr ---------- */
function setTrainPath(side,sf,t){train.position.set(0,0,0);
  const put=(o,s)=>{const p=pathAt(side,s);o.position.set(p.x,0,p.z);o.rotation.y=-p.h};
  put(loco,sf);WAG.forEach((w,i)=>{put(w,sf-(4.5+WL/2+i*WL))});
  for(const w of loco.userData.wheels)w.rotation.x=sf/.85;const ph=sf/.85;loco.userData.rods.forEach(r=>{r.position.y=.85+Math.sin(ph)*.25;r.position.z=-.6+Math.cos(ph)*.25});
  const ch=loco.localToWorld(V(0,4.9,-3.4)),bk=loco.localToWorld(V(0,4.9,2)).sub(ch).normalize();
  for(let i=0;i<SMOKE.length;i++){const s=SMOKE[i];const k=((t*2.2+i/SMOKE.length*1.6)%1.6)/1.6;s.position.copy(ch).addScaledVector(bk,k*9).add(V(Math.sin(i*7)*.4*k,k*3,0));s.scale.setScalar(.35+k*1.5);s.material.opacity=.75*(1-k)}}
function resetTrain(){loco.position.set(0,0,0);loco.rotation.set(0,0,0);WAG.forEach((w,i)=>{w.position.set(0,0,4.5+WL/2+i*WL);w.rotation.set(0,0,0);w.visible=true})}
function savePeople(s,t){PEOPLE.forEach((P,i)=>{const k=Math.max(0,Math.min(1,(s-i*.035)/.4)),e=inout(k);
  P.ropes.forEach(r=>r.visible=k<.08);P.p.rotation.x=lerp(-Math.PI/2,0,e);
  const jump=k>=1?Math.abs(Math.sin(t*7+i*1.7))*.55:0;
  P.L.position.set(P.tp.x+lerp(0,2.3,e),lerp(.72,1.13,e)+jump,P.tp.z);P.L.rotation.y=P.ry;
  const a=P.p.userData.arms;if(k>0){a[0].rotation.z=lerp(a[0].rotation.z,2.6+Math.sin(t*9+i)*.35,e);a[1].rotation.z=lerp(a[1].rotation.z,-2.6-Math.sin(t*9.5+i)*.35,e)}
  P.p.userData.mouth.scale.y=1.6+Math.abs(Math.sin(t*8+i))*.8})}
function tiePeople(){PEOPLE.forEach(P=>{P.ropes.forEach(r=>r.visible=true);P.p.rotation.x=-Math.PI/2;P.L.position.set(P.tp.x,.72,P.tp.z)})}
const billTex=canvasTex(256,128,(g,w,h)=>{g.fillStyle='#7fbf6a';g.fillRect(0,0,w,h);g.strokeStyle='#2f6b2a';g.lineWidth=10;g.strokeRect(8,8,w-16,h-16);g.beginPath();g.arc(w/2,h/2,34,0,7);g.fillStyle='#cfe8c0';g.fill();g.fillStyle='#2f6b2a';g.font='900 64px serif';g.textAlign='center';g.textBaseline='middle';g.fillText('$',w/2,h/2+4);g.font='900 30px sans-serif';g.fillText('100',40,30);g.fillText('100',w-40,h-28)});
const billM=new THREE.MeshStandardMaterial({map:billTex,side:THREE.DoubleSide,roughness:.9});
const BILLS=[];for(let i=0;i<46;i++){const b=new THREE.Mesh(new THREE.PlaneGeometry(.9,.45),billM);b.castShadow=true;b.visible=false;scene.add(b);
  BILLS.push({b,vx:(rnd()-.5)*9,vy:5+rnd()*9,vz:(rnd()-.5)*7,sp:rnd()*6+2,ph:rnd()*6})}
const COINS=[];for(let i=0;i<16;i++){const c=mesh(cyl(.16,.16,.04,14),M(0xf0c040,{metalness:.7,roughness:.3}),0,-9,0);scene.add(c);COINS.push({c,vx:(rnd()-.5)*7,vy:6+rnd()*6,vz:(rnd()-.5)*6})}
const HAT=new THREE.Group();{const hm=M(0x151515,{roughness:.4});HAT.add(mesh(cyl(.45,.45,.05,20),hm,0,0,0));HAT.add(mesh(cyl(.28,.3,.58,20),hm,0,.3,0));HAT.add(mesh(cyl(.305,.305,.1,20),M(0x8a1a1a),0,.08,0))}
HAT.visible=false;scene.add(HAT);
const HIT0=V(MILP_X(),1.0,MILP_Z()),HATEND=V(MILP_X()-3.6,.04,MILP_Z()-2.8);
function MILP_X(){return pathAt(-1,24).x}function MILP_Z(){return pathAt(-1,24).z}
function burst(k){ // k = s od nárazu
  const on=k>=0;MIL.L.visible=!on;
  BILLS.forEach((o,i)=>{o.b.visible=on;if(!on)return;const d=(1-Math.exp(-1.6*k))/1.6;
    let y=HIT0.y+o.vy*d-1.1*k-1.2*k*k*Math.exp(-k);y=Math.max(.03+i*.002,y);
    o.b.position.set(HIT0.x+o.vx*d+Math.sin(k*o.sp+o.ph)*.5,y,HIT0.z+o.vz*d);
    if(y>.05)o.b.rotation.set(k*o.sp+o.ph,k*o.sp*.7,Math.sin(k*3+o.ph));else o.b.rotation.set(-Math.PI/2,0,o.ph)});
  COINS.forEach(o=>{if(!on){o.c.position.y=-9;return}const y=Math.max(.06,1+o.vy*k-9.8*k*k/2);o.c.position.set(HIT0.x+o.vx*Math.min(k,1.4),y,HIT0.z+o.vz*Math.min(k,1.4));o.c.rotation.set(k*9,0,k*7)});
  HAT.visible=on;if(on){const u=Math.min(1,k/1.55);const p=HIT0.clone().lerp(HATEND,u);p.y=lerp(1.6,HATEND.y,u)+Math.sin(u*Math.PI)*8.5;
    if(k>1.55){const b=k-1.55;p.y=HATEND.y+Math.abs(Math.sin(b*9))*.35*Math.exp(-b*5)}
    HAT.position.copy(p);HAT.rotation.set(u<1?k*9:0,u<1?k*4:.6,u<1?k*6:Math.sin(Math.max(0,k-1.55)*9)*.25*Math.exp(-(k-1.55)*5))}}
const flash=document.getElementById('flash');

/* ---------- záběry (t = s od začátku záběru) ---------- */
const MILP=pathAt(-1,24),PPL0=pathAt(1,16),PPL1=pathAt(1,41);
const SH={
  // vlak jede, pak brzdí
  a_intro(t){const z=lerp(70,18,ease(t/2.8));const sp=Math.max(0,(1-t/2.8))*20;setTrain(z,sp,t);
    const cz=z+6;cam(V(-9+t*.6,4.6,cz+10),V(0,2.8,z-14),48);bub.style.opacity=0;tagL.style.opacity=tagR.style.opacity=0;setLever(0)},
  b_switch(t){setTrain(18,0,t+3);setLever(Math.sin(t*3)*.08);const u=ease(t/.8);
    cam(V(lerp(9,7,u),lerp(3,2.6,u),lerp(10,6.5,u)),V(3.4,1.7,2.4),lerp(55,42,u));tagL.style.opacity=tagR.style.opacity=0;bub.style.opacity=0},
  c_both(t){setTrain(18,0,t+4);const u=inout(t/2.6);
    cam(V(lerp(0,0,u),lerp(16,30,u),lerp(22,26,u)),V(0,0,lerp(-14,-22,u)),50);
    place(tagL,V(MILP.x,2.2,MILP.z),0,t>.5?1:0);place(tagR,V(PPL0.x,2.2,-28),0,t>1.0?1:0);bub.style.opacity=0},
  d_left(t){setTrain(18,0,t+7);const u=inout(t/1.35);
    cam(V(lerp(-2,MILP.x-.2,u),lerp(12,4.8,u),lerp(8,MILP.z+5.0,u)),V(lerp(-6,MILP.x-.9,u),lerp(1,.8,u),lerp(-10,MILP.z+.2,u)),lerp(50,44,u));
    tagL.style.opacity=0;tagR.style.opacity=0;bub.style.opacity=0},
  e_mil(t){setTrain(18,0,t+10);cam(V(MILP.x-.2+Math.sin(t*.5)*.15,4.8-t*.15,MILP.z+5.0-t*.2),V(MILP.x-.9,.8,MILP.z+.2),44-t*1.1);
    place(bub,V(MILP.x-1.4,1.8,MILP.z+.6),-40,1);tagL.style.opacity=0;tagR.style.opacity=0},
  f_right(t){setTrain(18,0,t+16);const u=inout(t/2.9);const q=pathAt(1,lerp(15,38,u)),q2=pathAt(1,lerp(18,41,u));
    cam(V(q.x+3.0,5.4,q.z+2.6),V(q2.x-.2,.6,q2.z),46);bub.style.opacity=0;tagL.style.opacity=0;tagR.style.opacity=0},
  g_lever(t){setTrain(18,0,t+19);const a=t<1.4?Math.sin(t*2.2)*.1:(t<2.5?lerp(0,.55,ease((t-1.4)/.4)):lerp(.55,-.55,ease((t-2.5)/.4)));setLever(a);
    cam(V(4.2+lerp(-3.5,-2.6,inout(t/3.4)),3.6,2.2+lerp(7.5,6,inout(t/3.4))),V(5.2,2.4,.8),46);bub.style.opacity=0;tagL.style.opacity=tagR.style.opacity=0},
  h_eject(t){setTrain(18,0,t+22);setLever(0);
    // vylosovaní cestující: vagóny vylétají z vlaku
    const sel=[2,5,7,10,13];sel.forEach((i,k)=>{const w=WAG[i];const s=t-2.6-k*.35;if(s<0){w.position.set(0,0,4.5+WL/2+i*WL);w.rotation.set(0,0,0);return}
      const dir=k%2?1:-1;w.position.set(dir*s*7,Math.max(-2,s*11-s*s*6.5),4.5+WL/2+i*WL+s*1.5);w.rotation.set(s*.9,0,dir*s*1.8)});
    cam(V(-34,30,30),V(0,0,86),46);bub.style.opacity=0},
  i_risk(t){setTrain(18,0,t+27);setLever(Math.sin(t*28)*.03);const u=ease(t/1.8);
    cam(V(4.2+lerp(-1.6,-1.0,u),lerp(3.9,3.7,u),2.2+lerp(3.6,2.4,u)),V(4.2,3.5,2.2),lerp(40,32,u));bub.style.opacity=0},
  j_end(t){setTrain(18,0,t+29);setLever(Math.sin(t*1.2)*.12);const u=inout(t/3.4);
    cam(V(lerp(10,2,u),lerp(9,18,u),lerp(22,26,u)),V(0,0,lerp(-10,-18,u)),50);
    place(tagL,V(MILP.x,2.2,MILP.z),0,1);place(tagR,V(PPL0.x,2.2,-28),0,1);bub.style.opacity=0},
};
Object.assign(SH,{
  k_lever(t){setTrain(18,0,t+30);const a=t<.25?Math.sin(t*20)*.05:lerp(0,.62,ease((t-.25)/.28));setLever(a);shake=t>.5&&t<.75?.06:0;
    cam(V(4.2-2.9,3.5,2.2+6.4-t*.6),V(4.6,2.3,.9),44);bub.style.opacity=0;tagL.style.opacity=tagR.style.opacity=0},
  l_saved(t){setTrain(18,0,t+31);setLever(.62);savePeople(t-.15,t);const u=inout(t/3.4);const q=pathAt(1,lerp(18,30,u)),q2=pathAt(1,lerp(22,36,u));
    cam(V(q.x+7.2,5.2,q.z+7.5),V(q2.x+1.6,1.3,q2.z),50);bub.style.opacity=0;tagL.style.opacity=tagR.style.opacity=0},
  m_hit(t){const th=1.55;setLever(.62);savePeople(9,t);WAG.forEach((w,i)=>w.visible=i<6);
    setTrainPath(-1,19+40*(t-th),t);burst(t-th);
    const fl=t-th;flash.style.opacity=fl>=0&&fl<.12?.85*(1-fl/.12):0;shake=fl>=0&&fl<.7?.35*(1-fl/.7):0;
    const camA=V(MILP_X()-6.5,4.4,MILP_Z()-11),lookA=V(MILP_X()+2.2,1.0,MILP_Z()+9);
    const camB=V(MILP_X()-7.2,2.5,MILP_Z()-7.2),lookB=V(HATEND.x+.7,.5,HATEND.z+.4);const v=inout((t-3.0)/1.1);
    cam(camA.clone().lerp(camB,v),lookA.clone().lerp(lookB,v),lerp(44,34,v));
    if(fl<0){place(bub,V(MILP_X(),1.7,MILP_Z()),-30,t>.15?1:0)}else bub.style.opacity=0;tagL.style.opacity=tagR.style.opacity=0},
});
window.SHOT=(name,opts={})=>{shot=name;t0=performance.now();if(opts.bub!==undefined)bubT.innerHTML=opts.bub;shake=0};
window.BUB=h=>{bubT.innerHTML=h};
window.SHAKE=v=>{shake=v};
function loop(now){requestAnimationFrame(loop);const t=(now-t0)/1000;anim(now/1000);if(shot&&SH[shot])SH[shot](t);sun.position.set(camera.position.x-30,50,camera.position.z+20);sun.target.position.set(camera.position.x,0,camera.position.z-20);renderer.render(scene,camera)}
requestAnimationFrame(loop);
window.__ready=true;
});
</script></body></html>
