<script>
Promise.all([document.fonts.load('900 92px BS'),document.fonts.load('800 58px IS')]).then(()=>{
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.setSize(W,H);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,W/H,.1,1200);
{const c=document.createElement('canvas');c.width=4;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);
 gr.addColorStop(0,'#3f86cf');gr.addColorStop(.55,'#9fcfef');gr.addColorStop(1,'#eef2e6');g.fillStyle=gr;g.fillRect(0,0,4,512);
 const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;scene.background=t}
scene.fog=new THREE.Fog(0xcfe3ea,90,420);
scene.add(new THREE.HemisphereLight(0xdff1ff,0x4a5a3a,.72));
const sun=new THREE.DirectionalLight(0xfff0d8,1.1);sun.position.set(-30,60,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:220});sun.shadow.bias=-.0006;scene.add(sun);scene.add(sun.target);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0,flatShading:true},o));
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d),cyl=(a,b,h,s=12)=>new THREE.CylinderGeometry(a,b,h,s),sph=(r,a=12,b=8)=>new THREE.SphereGeometry(r,a,b);
function mesh(g,m,x=0,y=0,z=0,cast=true){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;return o}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
const rnd=(s=>()=>((s=Math.imul(s^s>>>15,s|1)^(s+Math.imul(s^s>>>7,s|61)),((s^s>>>14)>>>0)/4294967296)))(4242);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const ease=u=>u<=0?0:u>=1?1:1-Math.pow(1-u,3),inout=u=>u<=0?0:u>=1?1:u*u*(3-2*u),lerp=(a,b,u)=>a+(b-a)*u,cl=(u)=>Math.max(0,Math.min(1,u));

/* ---------- propast ---------- */
const Z0=-48,Z1=-108,DEEP=-62;     // hrany propasti a dno
const grassTex=canvasTex(512,512,(g,w,h)=>{g.fillStyle='#6fa552';g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){g.fillStyle=`rgba(${40+Math.random()*60|0},${110+Math.random()*70|0},${40+Math.random()*40|0},.35)`;g.fillRect(Math.random()*w,Math.random()*h,2,5)}});
grassTex.wrapS=grassTex.wrapT=THREE.RepeatWrapping;grassTex.repeat.set(50,40);
const grassM=new THREE.MeshStandardMaterial({map:grassTex,roughness:1});
{const g=mesh(new THREE.PlaneGeometry(900,500),grassM,0,0,Z0+250,false);g.rotation.x=-Math.PI/2;scene.add(g)}
{const g=mesh(new THREE.PlaneGeometry(900,500),grassM,0,0,Z1-250,false);g.rotation.x=-Math.PI/2;scene.add(g)}
const rockM=[M(0x7a6f62),M(0x6a5f54),M(0x8a7e6e),M(0x5c534a)];
function cliff(z,dir){ // svislá skalní stěna, dir=+1 hledí k +z (vzdálený břeh), -1 k -z (blízký břeh)
  for(let x=-260;x<260;x+=5){let y=-1.2;while(y>DEEP-4){const h=6+rnd()*10,d=3+rnd()*7;const b=mesh(box(5.6+rnd()*2,h,d),rockM[(rnd()*4)|0],x+rnd()*2,y-h/2,z-dir*(d/2-1.5+rnd()*2.5),false);b.rotation.set((rnd()-.5)*.25,(rnd()-.5)*.3,(rnd()-.5)*.25);scene.add(b);y-=h*.8}}
  // okraj trávy přečnívá
  for(let x=-260;x<260;x+=6){const b=mesh(box(6.5,1.2,2.5),M(0x5d8f44),x,-.4,z+dir*.4,false);b.rotation.z=(rnd()-.5)*.2;scene.add(b)}}
cliff(Z0,-1);cliff(Z1,1);
// řeka na dně
const riverC=document.createElement('canvas');riverC.width=256;riverC.height=256;const rg=riverC.getContext('2d');
const riverT=new THREE.CanvasTexture(riverC);riverT.wrapS=riverT.wrapT=THREE.RepeatWrapping;riverT.repeat.set(30,3);riverT.encoding=THREE.sRGBEncoding;
function drawRiver(t){rg.fillStyle='#2f7fa6';rg.fillRect(0,0,256,256);for(let i=0;i<40;i++){const x=(i*53+t*60)%256,y=(i*37)%256;rg.fillStyle='rgba(220,245,255,.35)';rg.fillRect(x,y,18+(i%5)*6,3)}riverT.needsUpdate=true}
drawRiver(0);
{const r=mesh(new THREE.PlaneGeometry(700,(Z0-Z1)+10),new THREE.MeshStandardMaterial({map:riverT,roughness:.25,metalness:.2}),0,DEEP,(Z0+Z1)/2,false);r.rotation.x=-Math.PI/2;scene.add(r)}
for(let i=0;i<60;i++){const b=mesh(sph(1.5+rnd()*3,7,5),rockM[i%4],(rnd()-.5)*400,DEEP+.4,Z0-4-rnd()*4,false);b.scale.y=.5;scene.add(b);const c=b.clone();c.position.z=Z1+4+rnd()*4;scene.add(c)}
// mlha v propasti
const mistM=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.16,depthWrite:false});
const MIST=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(140,24),mistM);m.position.set(-120+i*22,DEEP+10+rnd()*16,(Z0+Z1)/2+(rnd()-.5)*30);m.rotation.y=(rnd()-.5)*.4;scene.add(m);MIST.push(m)}
// vodopád z protějšího břehu
{const wf=mesh(new THREE.PlaneGeometry(9,64),new THREE.MeshBasicMaterial({color:0xdff4ff,transparent:true,opacity:.75}),-62,-30,Z1+2.4,false);scene.add(wf)}

/* ---------- koleje ---------- */
// s<0 hlavní trať (z kladné k 0). Vlevo: k mostu (x=-13, rovně přes propast). Vpravo: oblouk podél propasti do tunelu.
const BR=13,RR=12,S1=30,S2=S1+Math.PI/2*RR;
function pathAt(side,s){ if(s<=0)return{x:0,z:-s,h:0};
  if(side<0||s<=S1){const u=Math.min(1,s/S1);const f=u*u*(3-2*u);const df=s<S1?(6*u-6*u*u)/S1:0;return{x:side*BR*f,z:-s,h:Math.atan2(side*BR*df,1)}}
  if(s<=S2){const a=(s-S1)/RR;return{x:BR+RR*(1-Math.cos(a)),z:-S1-RR*Math.sin(a),h:a}}
  return{x:BR+RR+(s-S2),z:-S1-RR,h:Math.PI/2}}
const railM=M(0x6b6f76,{metalness:.6,roughness:.35}),sleeperM=M(0x6b4a2a),ballastM=M(0x9a8f80,{roughness:1});
function buildTrack(side,s0,s1,o={}){const g=new THREE.Group();
  if(!o.noSleepers)for(let s=s0;s<s1;s+=1.0){const p=pathAt(side,s+.5);const sl=mesh(box(2.7,.16,.36),sleeperM,p.x,.14,p.z);sl.rotation.y=-p.h;g.add(sl)}
  for(const off of [-.75,.75]){for(let s=s0;s<s1;s+=1){const a=pathAt(side,s),b=pathAt(side,s+1);const ax=a.x+off*Math.cos(a.h),az=a.z+off*Math.sin(a.h);const bx=b.x+off*Math.cos(b.h),bz=b.z+off*Math.sin(b.h);
    const len=Math.hypot(bx-ax,bz-az);const r=mesh(box(.12,.16,len+.02),railM,(ax+bx)/2,.3,(az+bz)/2);r.rotation.y=Math.atan2(bx-ax,bz-az);g.add(r)}}
  if(!o.noBallast)for(let s=s0;s<s1;s+=2){const p=pathAt(side,s+1);const bl=mesh(box(3.6,.12,2.05),ballastM,p.x,.05,p.z,false);bl.rotation.y=-p.h;g.add(bl)}
  scene.add(g);return g}
buildTrack(1,-220,0);buildTrack(-1,0,-Z0);buildTrack(1,0,S2+28);buildTrack(-1,-Z1,-Z1+120);

/* ---------- starý dřevěný most ---------- */
const BX=-BR,BS0=-Z0,BS1=-Z1;       // most: x=-13, s od 48 do 108
const woodM=[M(0x7a5634),M(0x6b4a2a),M(0x5a3d22),M(0x86613c)],darkWood=M(0x3d2a18);
const bridge=new THREE.Group();scene.add(bridge);
const SEG=[];     // úseky mostu (kvůli zřícení): každý úsek = 6 m
for(let s=BS0;s<BS1;s+=6){const g=new THREE.Group();g.position.set(BX,0,-(s+3));bridge.add(g);SEG.push({g,s0:s,s1:s+6,fall:-1})}
const segOf=s=>SEG[Math.min(SEG.length-1,Math.max(0,Math.floor((s-BS0)/6)))];
const PLANKS=[];
for(let s=BS0+.3;s<BS1;s+=.62){const sg=segOf(s);const missing=rnd()<.09&&s>BS0+4;if(missing)continue;
  const p=mesh(box(3.3+rnd()*.4,.13,.46),woodM[(rnd()*4)|0],(rnd()-.5)*.15,.12,-(s-(sg.s0+3)));p.rotation.set((rnd()-.5)*.06,(rnd()-.5)*.08,(rnd()-.5)*.05);sg.g.add(p);PLANKS.push({p,s,sg})}
for(const sg of SEG){for(const x of [-.85,.85]){sg.g.add(mesh(box(.32,.42,6.02),darkWood,x,-.18,0))}
  for(const off of [-.75,.75])sg.g.add(mesh(box(.12,.16,6.02),railM,off,.3,0));
  for(const x of [-1.85,1.85]){for(const z of [-2.6,0,2.6]){const po=mesh(box(.14,1.2,.14),woodM[1],x,.7,z);po.rotation.z=(rnd()-.5)*.25;sg.g.add(po)}
    if(rnd()>.18){const rl=mesh(box(.1,.1,6),woodM[2],x,1.25,0);rl.rotation.x=(rnd()-.5)*.12;rl.rotation.z=(rnd()-.5)*.1;sg.g.add(rl)}}}
// dřevěné pilíře (trestle) dolů ke dnu
const TOWERS=[];
for(const s of [BS0+9,BS0+21,BS0+33,BS0+45,BS0+57]){const tg=new THREE.Group();tg.position.set(BX,0,-s);bridge.add(tg);TOWERS.push({g:tg,s});
  const hgt=-DEEP;
  for(const sx of [-1,1])for(const sz of [-1,1]){const p=mesh(box(.42,hgt+2,.42),woodM[0],sx*2.7,-hgt/2,sz*1.1);p.rotation.z=-sx*.045;p.rotation.x=sz*.02;tg.add(p)}
  for(let y=-3;y>DEEP;y-=8){const w=2.6+(-y)*.045;
    for(const sz of [-1.1,1.1]){const a=mesh(box(.18,.18,Math.hypot(2*w,8)),darkWood,0,y-4,sz);a.rotation.y=Math.PI/2;a.rotation.x=Math.atan2(8,2*w);tg.add(a);const b=a.clone();b.rotation.x=-a.rotation.x;tg.add(b)}
    tg.add(mesh(box(2*w+.6,.22,.3),darkWood,0,y,1.1));tg.add(mesh(box(2*w+.6,.22,.3),darkWood,0,y,-1.1))}}
// výstražná cedule
const warnTex=canvasTex(512,256,(g,w,h)=>{g.fillStyle='#e9d29a';g.fillRect(0,0,w,h);g.strokeStyle='#3d2a18';g.lineWidth=16;g.strokeRect(8,8,w-16,h-16);
  g.fillStyle='#b5302a';g.font='900 96px "BS",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('⚠ POZOR!',w/2,h/2-44);g.fillStyle='#3d2a18';g.font='900 64px "BS",sans-serif';g.fillText('STARÝ MOST',w/2,h/2+50)});
{const sg=new THREE.Group();sg.position.set(BX-3.4,0,Z0+7);sg.rotation.y=.35;scene.add(sg);
 for(const x of [-1.3,1.3]){const p=mesh(box(.18,2.6,.18),woodM[1],x,1.3,0);p.rotation.z=x*.05;sg.add(p)}
 const pl=mesh(box(3.2,1.6,.12),woodM[3],0,2.4,0);pl.rotation.z=-.08;sg.add(pl);const f=new THREE.Mesh(new THREE.PlaneGeometry(3.0,1.5),new THREE.MeshStandardMaterial({map:warnTex,roughness:.9}));f.position.set(0,2.4,.07);f.rotation.z=-.08;sg.add(f)}
// padající prkna (vlastní kusy, aby šla „uvolnit“)
const FALLP=[];for(let i=0;i<10;i++){const p=mesh(box(3.3,.13,.46),woodM[i%4],0,-999,0);scene.add(p);FALLP.push(p)}

/* ---------- hory a tunel (objížďka) ---------- */
const snowM=M(0xf4f6f8),mtM=[M(0x7d8a7a),M(0x6f7c6c),M(0x8b9686)];
for(let i=0;i<9;i++){const x=70+i*34+rnd()*20,z=-30-rnd()*140,h=70+rnd()*70;const m=mesh(new THREE.ConeGeometry(40+rnd()*25,h,7),mtM[i%3],x,h/2-6,z,false);m.rotation.y=rnd()*3;scene.add(m);
  const sn=mesh(new THREE.ConeGeometry((40)*.33,h*.33,7),snowM,x,h*.83-6,z,false);sn.rotation.y=m.rotation.y;scene.add(sn)}
for(let i=0;i<8;i++){const x=-250+i*65,z=-230-rnd()*80,h=90+rnd()*60;const m=mesh(new THREE.ConeGeometry(55+rnd()*25,h,7),mtM[i%3],x,h/2-6,z,false);scene.add(m);const sn=mesh(new THREE.ConeGeometry(55*.33,h*.33,7),snowM,x,h*.83-6,z,false);scene.add(sn)}
// skalní masiv s portálem tunelu
const TX=BR+RR+28,TZ=-S1-RR;
{const rock=mesh(new THREE.DodecahedronGeometry(34,1),mtM[1],TX+30,6,TZ-4,false);rock.scale.set(1,1.1,1.2);scene.add(rock);
 const portal=new THREE.Group();portal.position.set(TX,0,TZ);portal.rotation.y=-Math.PI/2;scene.add(portal);
 const stone=M(0x8e8678);portal.add(mesh(box(9,1.6,3),stone,0,8.2,0));for(const x of [-3.9,3.9])portal.add(mesh(box(1.4,8,3),stone,x,4,0));
 portal.add(mesh(box(6.4,7.4,.4),M(0x0d0d0f,{roughness:1}),0,3.7,.6,false));
 const lbl=canvasTex(512,128,(g,w,h)=>{g.fillStyle='#e8e0cc';g.fillRect(0,0,w,h);g.fillStyle='#1e2a33';g.font='900 76px "BS",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('TUNEL',w/2,h/2+4)});
 const pl=new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.1),new THREE.MeshBasicMaterial({map:lbl}));pl.position.set(0,8.2,-1.55);pl.rotation.y=Math.PI;portal.add(pl)}
// stromy na blízkém břehu
{const trunk=M(0x6b4a2a),leaf=[M(0x2f6e3c),M(0x3f8a4a),M(0x4f9a52)];
 for(let i=0;i<260;i++){const x=(rnd()-.5)*300,z=Z0+4+rnd()*260;
   if(Math.abs(x)<9)continue;let near=false;for(let s=0;s<S2+30;s+=3){for(const sd of [-1,1]){const p=pathAt(sd,s);if(Math.hypot(x-p.x,z-p.z)<7)near=true}}if(near)continue;
   if(z<Z0+6)continue;if(x>8&&x<20&&z<10&&z>-10)continue;
   const s=1+rnd()*1.6;const t=new THREE.Group();t.position.set(x,0,z);t.add(mesh(cyl(.25*s,.32*s,1.6*s,6),trunk,0,.8*s,0));
   t.add(mesh(new THREE.ConeGeometry(1.8*s,3.4*s,7),leaf[i%3],0,3*s,0));t.add(mesh(new THREE.ConeGeometry(1.3*s,2.6*s,7),leaf[(i+1)%3],0,4.4*s,0));scene.add(t)}
 for(let i=0;i<120;i++){const x=(rnd()-.5)*400,z=Z1-6-rnd()*200;if(x>40)continue;const s=1+rnd()*1.8;const t=new THREE.Group();t.position.set(x,0,z);t.add(mesh(cyl(.25*s,.32*s,1.6*s,6),trunk,0,.8*s,0));t.add(mesh(new THREE.ConeGeometry(1.8*s,3.4*s,7),leaf[i%3],0,3*s,0));scene.add(t)}
 const cloud=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,flatShading:true});
 for(let i=0;i<12;i++){const c=new THREE.Group();c.position.set(-200+i*40,55+rnd()*30,-220-rnd()*80);for(let k=0;k<4;k++){const b=mesh(sph(6+rnd()*4,8,6),cloud,k*7-10,rnd()*2,0,false);b.scale.y=.6;c.add(b)}scene.add(c)}}

/* ---------- výhybka: páka a cedule ---------- */
const leverG=new THREE.Group();leverG.position.set(4.2,0,2.2);scene.add(leverG);
leverG.add(mesh(box(2.2,.3,1.6),M(0xb9b4a8),0,.15,0));leverG.add(mesh(box(1.1,.9,.9),M(0x3b4a5a,{metalness:.3}),0,.75,0));leverG.add(mesh(box(1.3,.12,1.1),M(0x2b3440,{metalness:.3}),0,1.25,0));
const pivot=new THREE.Group();pivot.position.set(0,1.25,0);leverG.add(pivot);
pivot.add(mesh(cyl(.07,.09,2.6,10),M(0x8a8f96,{metalness:.7,roughness:.3}),0,1.3,0));pivot.add(mesh(sph(.24,16,12),M(0xd4361f,{roughness:.35}),0,2.65,0));
leverG.add(mesh(box(3.6,.1,.12),M(0x5a5f66,{metalness:.6}),-2.2,.32,-.6));
const signTex=canvasTex(1024,320,(g,w,h)=>{g.fillStyle='#fffaf0';g.fillRect(0,0,w,h);g.strokeStyle='#1e2a33';g.lineWidth=14;g.strokeRect(7,7,w-14,h-14);
  g.beginPath();g.moveTo(w/2,20);g.lineTo(w/2,h-20);g.lineWidth=6;g.stroke();
  g.font='900 92px "BS",sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#b5302a';g.fillText('◀ MOST',w/4,h/2+4);g.fillStyle='#2f6f9f';g.fillText('OBJÍŽĎKA ▶',w*3/4,h/2+4)});
{const sign=new THREE.Group();sign.position.set(7.4,0,-1.2);sign.rotation.y=-.35;scene.add(sign);
 for(const x of [-2.2,2.2])sign.add(mesh(cyl(.09,.09,3.6,8),M(0x5a4030),x,1.8,0));sign.add(mesh(box(5.4,1.7,.12),M(0x1e2a33),0,3.2,0));
 const p=new THREE.Mesh(new THREE.PlaneGeometry(5.2,1.62),new THREE.MeshBasicMaterial({map:signTex}));p.position.set(0,3.2,.07);sign.add(p)}

/* ---------- vlak ---------- */
const train=new THREE.Group();scene.add(train);
const loco=new THREE.Group();train.add(loco);
{const green=M(0x2f6b4a,{roughness:.5,metalness:.15}),dark=M(0x1e2a24,{roughness:.6}),red=M(0xb5302a,{roughness:.5}),brass=M(0xc9973f,{metalness:.7,roughness:.3});
 loco.add(mesh(box(2.6,.5,9.2),dark,0,1.05,0));
 const boiler=mesh(cyl(1.15,1.15,5.6,20),green,0,2.35,-1.4);boiler.rotation.x=Math.PI/2;loco.add(boiler);
 for(const z of [-3.3,-1.6,.1]){const b=mesh(cyl(1.19,1.19,.14,20),brass,0,2.35,z);b.rotation.x=Math.PI/2;loco.add(b)}
 const front=mesh(cyl(1.2,1.2,.5,20),dark,0,2.35,-4.35);front.rotation.x=Math.PI/2;loco.add(front);
 const lamp=mesh(cyl(.28,.32,.3,14),M(0xfff2b0,{emissive:0xffd25a,emissiveIntensity:1.2}),0,3.0,-4.7);lamp.rotation.x=Math.PI/2;loco.add(lamp);
 loco.add(mesh(cyl(.35,.45,1.3,14),dark,0,3.95,-3.4));loco.add(mesh(cyl(.5,.38,.25,14),dark,0,4.7,-3.4));
 loco.add(mesh(sph(.48,14,10),brass,0,3.5,-1.4));
 loco.add(mesh(box(2.9,2.6,2.8),green,0,3.0,2.6));loco.add(mesh(box(3.3,.25,3.3),dark,0,4.4,2.6));
 for(const x of [-1.46,1.46])loco.add(mesh(box(.04,1,1.1),M(0xbfe6ff,{emissive:0x335566,emissiveIntensity:.3}),x,3.4,2.4));
 const cc=mesh(cyl(.05,1.5,1.2,4),red,0,.8,-5.0);cc.rotation.x=-Math.PI/2.4;cc.rotation.y=Math.PI/4;loco.add(cc);
 loco.add(mesh(box(2.8,.4,.3),red,0,1.15,-4.7));
 const wheels=[];for(const z of [-2.8,-.6,1.6])for(const x of [-1.25,1.25]){const w=mesh(cyl(.85,.85,.22,18),red,x,.85,z);w.rotation.z=Math.PI/2;loco.add(w);wheels.push(w)}
 loco.userData.wheels=wheels;
 const rod=mesh(box(.08,.12,4.6),M(0x9aa0a8,{metalness:.8}),1.42,.85,-.6);loco.add(rod);const rod2=rod.clone();rod2.position.x=-1.42;loco.add(rod2);loco.userData.rods=[rod,rod2];}
const wagCols=[0xd4361f,0x2f6f9f,0x3f8a5c,0xf0a03a,0x7a4fa3,0x2b9fc2,0xc4453a,0xe24a7a];
const WAG=[];const WL=12.2;
for(let i=0;i<12;i++){const w=new THREE.Group();const col=M(wagCols[i%8],{roughness:.55});const dark=M(0x2b3440);
  w.add(mesh(box(2.8,2.5,WL-.6),col,0,2.45,0));w.add(mesh(box(3.1,.22,WL-.3),M(0x6b7078),0,3.8,0));w.add(mesh(box(2.4,.25,WL-.8),M(0x5a5f66),0,4.0,0));
  for(let k=0;k<5;k++)for(const x of [-1.41,1.41])w.add(mesh(box(.04,.9,1.3),M(0xfff4cc,{emissive:0xffe08a,emissiveIntensity:.35}),x,2.85,-4.4+k*2.2));
  w.add(mesh(box(2.4,.35,WL-1),dark,0,1.05,0));
  for(const z of [-4,4])for(const x of [-1.15,1.15]){const wh=mesh(cyl(.5,.5,.2,14),dark,x,.62,z);wh.rotation.z=Math.PI/2;w.add(wh)}
  train.add(w);WAG.push(w)}
const CARS=[{o:loco,off:0}].concat(WAG.map((w,i)=>({o:w,off:4.5+WL/2+i*WL})));
const SMOKE=[];const smokeM=new THREE.MeshStandardMaterial({color:0xf2f2f2,roughness:1,transparent:true,opacity:.85,flatShading:true});
for(let i=0;i<26;i++){const s=mesh(sph(.6,8,6),smokeM.clone(),0,-50,0,false);scene.add(s);SMOKE.push(s)}
// postaví vlak na trať: sf = poloha lokomotivy (s), side = větev; fallS = kde se most zřítil (vozy za tím bodem padají)
function placeTrain(side,sf,t,o={}){
  for(const c of CARS){const s=sf-c.off;const p=pathAt(side,s);c.o.position.set(p.x,0,p.z);c.o.rotation.set(0,-p.h,0);
    if(o.fallS!==undefined&&s>o.fallS){const k=(s-o.fallS)/Math.max(1,o.v||30);   // čas od přejetí hrany
      const y=-0.5*14*k*k*8;c.o.position.y=Math.max(DEEP-2,y);c.o.rotation.x=-Math.min(1.25,k*1.6);c.o.rotation.z=Math.sin(c.off)*.4*Math.min(1,k*2);
      if(y<DEEP-2){c.o.position.y=DEEP-1.2-Math.min(4,(y-(DEEP-2))*-.02);c.o.rotation.x=-1.25}}}
  for(const w of loco.userData.wheels)w.rotation.x=-sf/.85;const ph=-sf/.85;loco.userData.rods.forEach(r=>{r.position.y=.85+Math.sin(ph)*.25;r.position.z=-.6+Math.cos(ph)*.25});
  const ch=loco.localToWorld(V(0,4.9,-3.4)),bk=loco.localToWorld(V(0,4.9,2)).sub(ch).normalize();
  for(let i=0;i<SMOKE.length;i++){const s=SMOKE[i];const k=((t*2.0+i/SMOKE.length*1.8)%1.8)/1.8;s.position.copy(ch).addScaledVector(bk,k*(4+(o.v||0)*.25)).add(V(Math.sin(i*7)*.5*k,k*4,0));s.scale.setScalar(.35+k*1.7);s.material.opacity=.8*(1-k)}}

/* ---------- kostka ---------- */
const dieFace=n=>canvasTex(128,128,(g,w,h)=>{g.fillStyle='#fffaf0';g.fillRect(0,0,w,h);g.strokeStyle='#d9d0be';g.lineWidth=6;g.strokeRect(3,3,w-6,h-6);g.fillStyle=n<=3?'#2f8a4a':'#c0302a';
  const P={1:[[64,64]],2:[[34,34],[94,94]],3:[[30,30],[64,64],[98,98]],4:[[34,34],[94,34],[34,94],[94,94]],5:[[32,32],[96,32],[64,64],[32,96],[96,96]],6:[[34,28],[94,28],[34,64],[94,64],[34,100],[94,100]]}[n];
  for(const [x,y] of P){g.beginPath();g.arc(x,y,12,0,7);g.fill()}});
const DIE=new THREE.Mesh(new THREE.BoxGeometry(2.4,2.4,2.4),[1,6,2,5,3,4].map(n=>new THREE.MeshStandardMaterial({map:dieFace(n),roughness:.4})));
DIE.castShadow=true;DIE.visible=false;scene.add(DIE);

/* ---------- ovládání a záběry ---------- */
let shake=0,shot=null,t0=0;
function setLever(a){pivot.rotation.z=a}
function cam(p,l,fov=50){camera.position.copy(p);camera.fov=fov;camera.updateProjectionMatrix();camera.lookAt(l);
  if(shake>0){camera.position.x+=Math.sin(performance.now()*.061)*shake;camera.position.y+=Math.cos(performance.now()*.047)*shake}}
const proj=v=>{const q=v.clone().project(camera);return{x:(q.x*.5+.5)*W,y:(-q.y*.5+.5)*H,z:q.z}};
const tagL=document.getElementById('tagL'),tagR=document.getElementById('tagR'),vig=document.getElementById('vig'),flash=document.getElementById('flash');
function place(el,v,op=1){const p=proj(v);el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.opacity=p.z<1?op:0}
function hideTags(){tagL.style.opacity=tagR.style.opacity=0}
function resetBridge(){SEG.forEach(sg=>{sg.g.position.set(BX,0,-(sg.s0+3));sg.g.rotation.set(0,0,0)});TOWERS.forEach(tw=>{tw.g.position.set(BX,0,-tw.s);tw.g.rotation.set(0,0,0)});FALLP.forEach(p=>p.position.y=-999)}
function sway(t,a=1){bridge.rotation.z=Math.sin(t*2.1)*.004*a;bridge.position.x=0}
// prkno uvolněné v čase tt z místa s
function dropPlank(i,s,t,tt){const p=FALLP[i];const k=t-tt;if(k<0){p.position.y=-999;return}const pp=pathAt(-1,s);
  p.position.set(pp.x+(i%2?.6:-.6)*k,.12-4.9*k*k*1.3,pp.z+k*.4);p.rotation.set(k*(2+i*.3),k*.7,k*(1.5+i*.2))}
function collapse(t,tc){ // most se zřítí ve středu
  SEG.forEach((sg,i)=>{const mid=Math.abs(i-4.5);const k=t-tc-mid*.12;if(k<0||mid>3)return;const dir=i<4.5?-1:1;
    sg.g.position.y=-4.9*k*k*1.6;sg.g.rotation.x=dir*k*.9;sg.g.rotation.z=(i%2?.6:-.5)*k*.4});
  TOWERS.forEach((tw,i)=>{if(i<1||i>3)return;const k=t-tc-.15-i*.08;if(k<0)return;tw.g.rotation.x=(i%2?1:-1)*Math.min(.9,k*k*.9);tw.g.rotation.z=(i-2)*Math.min(.5,k*k*.5);tw.g.position.y=-Math.min(20,k*k*4)})}
const SPL=[];{const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6,transparent:true,opacity:.9,flatShading:true});for(let i=0;i<40;i++){const s=mesh(sph(.9,7,5),m.clone(),0,-999,0,false);scene.add(s);SPL.push({s,vx:(rnd()-.5)*14,vy:10+rnd()*14,vz:(rnd()-.5)*10})}}
function splash(k,at){SPL.forEach(o=>{if(k<0||k>2.2){o.s.position.y=-999;return}const y=DEEP+o.vy*k-9.8*k*k;o.s.position.set(at.x+o.vx*k,Math.max(DEEP,y),at.z+o.vz*k);o.s.scale.setScalar(1+k*1.5);o.s.material.opacity=.9*(1-k/2.2)})}

const SH={
  // vlak se řítí po hlavní trati, kamera před ním, nízko
  a_rush(t,d){resetBridge();const sf=-140+t*34;placeTrain(-1,sf,t,{v:34});shake=.05;
    cam(V(-7+t*.8,3.2,-sf+6-t*3.2-26),V(0,2.6,-sf+10),52);hideTags();sway(t)},
  // odhalení propasti: kamera přeletí přes okraj a skloní se dolů
  b_gorge(t,d){resetBridge();placeTrain(-1,-60,t,{v:0});const u=inout(t/(d||3));
    cam(V(lerp(-42,-38,u),lerp(26,14,u),lerp(Z0+26,Z0+6,u)),V(lerp(-24,-20,u),lerp(-24,-52,u),lerp(Z0-30,Z0-32,u)),lerp(58,64,u));hideTags();sway(t)},
  // most zblízka: kamera jede nad mostem, prkna padají
  c_bridge(t,d){resetBridge();placeTrain(-1,-60,t,{v:0});const u=inout(t/(d||4));sway(t,2.5);
    cam(V(BX+lerp(4.5,3.2,u),lerp(4.2,3.4,u),lerp(Z0+12,Z0-14,u)),V(BX-.4,lerp(.2,-1.5,u),lerp(Z0-6,Z0-34,u)),56);
    dropPlank(0,BS0+11,t,.6);dropPlank(1,BS0+16,t,1.5);dropPlank(2,BS0+22,t,2.4);dropPlank(3,BS0+27,t,3.2);hideTags()},
  // prkno praskne a padá do hlubiny, kamera ho sleduje
  d_plank(t,d){resetBridge();placeTrain(-1,-60,t,{v:0});sway(t,3);const s=BS0+18;const pp=pathAt(-1,s);
    dropPlank(4,s,t,.35);const p=FALLP[4];const k=Math.max(0,t-.35);
    cam(V(pp.x+5.5,1.8-Math.min(30,4.9*k*k*1.1),pp.z+6),V(pp.x,Math.max(DEEP,p.position.y),pp.z),50);shake=t>.3&&t<.6?.12:0;hideTags()},
  // objížďka: kamera letí po pravé trati obloukem k tunelu
  e_detour(t,d){resetBridge();placeTrain(-1,-60,t,{v:0});const u=inout(t/(d||3.5));const q=pathAt(1,lerp(16,S2+18,u)),q2=pathAt(1,lerp(26,S2+28,u));
    cam(V(q.x-5,lerp(7,6,u),q.z+9),V(q2.x+2,1.5,q2.z),52);hideTags();sway(t)},
  // páka a cedule
  f_lever(t,d){resetBridge();placeTrain(-1,-18,t,{v:0});const a=Math.sin(t*2.2)*.12;setLever(a);const u=inout(t/(d||3.4));
    cam(V(4.2+lerp(-3.4,-2.4,u),3.6,2.2+lerp(7.6,6,u)),V(5.6,2.6,.4),48);hideTags();sway(t)},
  // celkový pohled s oběma cestami
  g_both(t,d){resetBridge();placeTrain(-1,-22,t,{v:0});setLever(Math.sin(t*1.2)*.12);const u=inout(t/(d||3.4));
    cam(V(lerp(18,8,u),lerp(30,42,u),lerp(34,40,u)),V(lerp(-2,0,u),-6,lerp(-30,-40,u)),54);
    place(tagL,V(BX,4,Z0-10),t>.3?1:0);place(tagR,V(TX-6,9,TZ),t>.7?1:0);sway(t)},
  // kostka se točí ve vzduchu před mostem
  h_dice(t,d){resetBridge();placeTrain(-1,-60,t,{v:0});sway(t);DIE.visible=true;const c=V(BX+3,6.5,Z0+4);
    DIE.position.set(c.x,c.y+Math.sin(t*3)*.5,c.z);DIE.rotation.set(t*7.3,t*5.1,t*3.7);
    cam(V(c.x+4,c.y+1.5,c.z+9),V(c.x-1,c.y-1.5,c.z-6),50);hideTags()},
  // přejedeme (vlak přejede most)
  i_cross(t,d){resetBridge();DIE.visible=false;const sf=58+t*22;placeTrain(-1,sf,t,{v:22});sway(t,2);const lp=pathAt(-1,sf-6);
    cam(V(BX+15,6.5,lp.z+14),V(BX,2,lp.z-2),50);hideTags()},
  // …nebo spadneme: most se zřítí a vlak padá do řeky
  j_fall(t,d){resetBridge();DIE.visible=false;const v=24,tc=.45;const sf=30+t*v;const fallS=BS0+24;
    if(t>=tc){collapse(t,tc);placeTrain(-1,sf,t,{fallS,v})}else{placeTrain(-1,sf,t,{v})}
    sway(t,t<tc?6:0);vig.style.opacity=Math.min(.8,t*.6);
    const th=(fallS-30)/v+1.05,loS=pathAt(-1,fallS+24);splash(t-th,V(loS.x,DEEP,loS.z));
    flash.style.opacity=(t-th>=0&&t-th<.12)?.6:0;shake=(t>tc&&t<tc+.5)?.3:(t-th>0&&t-th<.6?.3:0);
    const u=inout((t-1.6)/1.6);cam(V(BX+36,lerp(2,-18,u),Z0-36),V(BX,lerp(-8,-50,u),Z0-38),lerp(70,72,u))},
  // závěr: riskneš to?
  k_end(t,d){resetBridge();DIE.visible=false;vig.style.opacity=0;placeTrain(-1,-22,t,{v:0});setLever(Math.sin(t*1.2)*.12);const u=inout(t/(d||3));
    cam(V(lerp(-6,-22,u),lerp(10,16,u),lerp(-14,Z0+4,u)),V(BX-2,lerp(-10,-30,u),Z0-30),56);
    place(tagL,V(BX,4,Z0-12),1);hideTags();place(tagL,V(BX,4,Z0-12),1);sway(t,2)},
};
window.SHOT=(name,opts={})=>{shot=name;t0=performance.now();window.__dur=opts.d||0;shake=0;vig.style.opacity=0;flash.style.opacity=0;DIE.visible=false};
window.SHAKE=v=>{shake=v};
function loop(now){requestAnimationFrame(loop);const t=(now-t0)/1000;drawRiver(now/1000);MIST.forEach((m,i)=>m.position.x+=Math.sin(now/3000+i)*.01);
  if(shot&&SH[shot])SH[shot](t,window.__dur);sun.position.set(camera.position.x-30,60,camera.position.z+20);sun.target.position.set(camera.position.x,0,camera.position.z-20);renderer.render(scene,camera)}
requestAnimationFrame(loop);
window.__ready=true;
});
</script></body></html>
