<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vlak followerů</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Každá jízdenka = jeden vagón. Internet rozhoduje, kam vlak jede.">
<meta property="og:type" content="website">
<meta property="og:title" content="Vlak followerů">
<meta property="og:description" content="Každá jízdenka = jeden vagón. Vyzvedni si ji a podívej se do svého vagónu.">
<meta property="og:url" content="https://vlak-followeru.vercel.app/">
<meta property="og:image" content="https://vlak-followeru.vercel.app/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="cs_CZ">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#4f9fe0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/qrcode.js"></script>
<style>
/* Layout: hra na celou obrazovku — 3D vlak v slunečném odpoledni vzadu, nahoře tabule s čísly, dole dok s akcemi, panely vyjíždějí jako papírové karty. Nástupiště (jízdenka) je první, co člověk vidí. Jeden světlý svět. */
:root{
  --night:#f5efe2;
  --night-2:#fbf7ee;
  --panel:#ffffff;
  --panel-2:#f2eadb;
  --glass:rgba(255,251,243,.9);
  --line:#e3d8c2;
  --ink:#1e2a33;
  --muted:#5d6970;
  --dim:#8a9399;
  --lamp:#f0a03a;
  --lamp-2:#b45f12;
  --signal:#cf4630;
  --moss:#3d8a5a;
  --paper:#e9dcc0;
  --paper-ink:#2a2116;
  --stamp:#7a2a1c;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
  --sl:max(16px,env(safe-area-inset-left,0px));
  --sr:max(16px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.game{overflow:hidden;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
body.game::before{display:none}
a{color:var(--lamp-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:.01em;text-wrap:balance;margin:0;text-transform:uppercase}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:.9rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--lamp);color:var(--lamp-2)}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:#1d1408}
.btn.primary:hover{background:#f6b55c;border-color:#f6b55c;color:#1d1408}
.btn.small{padding:6px 10px;font-size:.8rem;border-radius:8px}
.btn.danger:hover{border-color:var(--signal);color:var(--signal)}
.btn.icon{padding:9px;width:42px;height:42px}
.btn svg{width:18px;height:18px;flex:none}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--lamp);outline:none}
.bar{height:8px;background:var(--night);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--lamp) 0 12px,#d79a3f 12px 14px);border-radius:6px;transition:width .6s}
.demo-tag{display:inline-block;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--night);background:var(--muted);border-radius:4px;padding:1px 5px;vertical-align:middle}
.err{color:var(--signal);font-size:.86rem;min-height:1.1em}

/* ===== GAME ===== */
#game{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;background:rgba(255,252,245,.95);border:1.5px solid var(--lamp);color:var(--ink);box-shadow:0 4px 14px rgba(30,42,51,.18);border-radius:999px;padding:3px 10px;will-change:transform}
.lbl.me{background:var(--lamp);color:#1d1408;font-weight:600}
.lbl.big{font-size:15px;padding:6px 14px;display:grid;justify-items:center;line-height:1.25;border-radius:12px}
.lbl.big small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.lbl.drv{background:#1f7a5a;border-color:#d9a13b;color:#fff}
.lbl.anon{border-color:var(--line);color:var(--muted)}
.lbl::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid;border-bottom:1px solid;border-color:inherit;transform:translateX(-50%) rotate(45deg)}

.hud-top{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 12px) var(--sr) 0 var(--sl);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.hud-top>*{pointer-events:auto}
.brand{display:grid;gap:2px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,5vw,2.2rem);text-transform:uppercase;line-height:.95;letter-spacing:.02em;color:#fff;text-shadow:0 2px 0 rgba(30,60,90,.35),0 4px 18px rgba(30,60,90,.35)}
.brand span{font-size:.8rem;font-weight:600;color:#fff;text-shadow:0 1px 6px rgba(30,60,90,.6)}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:grid;gap:0;min-width:0;text-align:right;backdrop-filter:blur(6px)}
.stat .sub{font-size:.68rem;font-weight:600;color:var(--signal);white-space:nowrap}
.stat .k{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--lamp-2);line-height:1.05;font-variant-numeric:tabular-nums}
button.stat{cursor:pointer;color:inherit;font:inherit}
button.stat:hover{border-color:var(--lamp)}
.stat .mini{height:4px;background:var(--night);border-radius:3px;overflow:hidden;margin-top:4px;display:block}
.stat .mini i{display:block;height:100%;background:var(--lamp)}
@media (max-width:560px){.stat.opt-s{display:none}.stat .v{font-size:1.15rem}}
.local-chip{position:absolute;top:calc(var(--st) + 84px);left:var(--sl);font-size:.75rem;background:#fff1d6;border:1px solid #e9c58f;color:var(--lamp-2);padding:4px 10px;border-radius:999px;text-decoration:none}

.hud-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 var(--sr) calc(var(--sb) + 12px) var(--sl);display:grid;gap:10px;pointer-events:none}
.hud-bottom>*{pointer-events:auto}
.ctx{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.plate{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 12px;display:grid;min-width:0;backdrop-filter:blur(6px);text-align:center}
.plate .a{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.plate .b{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.plate .b em{font-style:normal;color:var(--lamp-2)}
.navbtn{background:var(--glass);backdrop-filter:blur(6px)}
.dock{justify-self:center;display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:5px;max-width:100%;overflow-x:auto;scrollbar-width:none;backdrop-filter:blur(8px)}
.dock::-webkit-scrollbar{display:none}
.dock button{white-space:nowrap;appearance:none;border:0;background:none;color:var(--muted);border-radius:11px;padding:7px 10px;display:grid;justify-items:center;gap:3px;cursor:pointer;min-width:58px;position:relative;font-size:.68rem;font-weight:600;letter-spacing:.02em}
.dock button svg{width:22px;height:22px}
.dock button:hover,.dock button[aria-pressed=true]{color:var(--ink);background:var(--panel-2)}
.dock button.hot{color:#1d1408;background:var(--lamp)}
.dock button.hot:hover{background:#f6b55c;color:#1d1408}
.dock .dot{position:absolute;top:6px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 2px var(--night)}
@media (max-width:420px){#editBtn{padding:9px 11px}#editBtn .lg{display:none}.dock button{min-width:50px;padding:7px 5px;font-size:.62rem}.brand span{display:none}.ctx{flex-wrap:nowrap}.plate .b{font-size:1.05rem;max-width:44vw}.plate{padding:6px 10px}}

/* boarding card (first screen) */
.boarding{position:absolute;left:50%;top:calc(var(--st) + 50%);transform:translate(-50%,-52%);width:min(440px,calc(100% - 32px));background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;backdrop-filter:blur(10px);box-shadow:0 24px 60px rgba(30,42,51,.25);max-height:calc(100% - 40px - var(--st) - var(--sb));overflow:auto;z-index:5}
.boarding h1{font-size:clamp(2.4rem,9vw,3.4rem);font-weight:900;line-height:.92}
.boarding .lead{color:var(--lamp-2);font-size:1.02rem}
.boarding .counter{display:flex;gap:16px;font-family:var(--mono);font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.boarding .counter b{font-family:var(--display);font-size:1.5rem;color:var(--ink);font-weight:800;display:block;line-height:1}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;font-size:.9rem;color:var(--muted);align-items:baseline}
.steps li::before{counter-increment:s;content:counter(s);font-family:var(--mono);font-size:.72rem;color:var(--night);background:var(--lamp);border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.steps li b{color:var(--ink);font-weight:600}
.claim{display:grid;gap:10px}
.nickrow{display:flex;gap:8px}
.nickrow input{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--lamp);width:18px;height:18px;flex:none}
.fine{font-size:.78rem;color:var(--dim)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px;font-size:.88rem;justify-self:center}

/* sheets */
.sheet{position:absolute;right:var(--sr);top:calc(var(--st) + 84px);bottom:calc(var(--sb) + 140px);width:min(440px,calc(100% - 32px));background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);box-shadow:0 24px 60px rgba(30,42,51,.25);display:flex;flex-direction:column;overflow:hidden;z-index:6}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:1.7rem}
.sheet-b{padding:16px;overflow:auto;display:grid;grid-auto-rows:max-content;gap:16px;align-content:start;overscroll-behavior:contain}
@media (max-width:640px){
  .sheet.half{max-height:46%}
  .sheet{left:0;right:0;width:auto;top:auto;bottom:0;max-height:82%;border-radius:18px 18px 0 0;padding-bottom:var(--sb)}
  .sheet-h{padding-left:var(--sl);padding-right:var(--sr)}
  .sheet-b{padding-left:var(--sl);padding-right:var(--sr)}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:grid;gap:8px}
.card h3{font-size:1.35rem}
.opt{display:grid;gap:5px;margin-top:6px}
.opt-top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.opt-top span:last-child{font-family:var(--mono);color:var(--lamp-2)}
.opt.win .opt-top span:first-child::after{content:" · vede";font-family:var(--mono);font-weight:400;font-size:.72rem;color:var(--moss)}
.note{font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.task{background:#fff4e0;border:1px dashed #e2b56f;border-radius:8px;padding:10px 12px}
.task .eyebrow{color:var(--lamp-2)}
.mapbox{background:#eef3e4;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;overflow-y:hidden}
.mapbox svg{display:block;min-width:620px;width:100%;height:auto;aspect-ratio:1060/680}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.76rem;color:var(--muted)}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:20px;height:4px;border-radius:2px;display:inline-block}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes pulse{0%{r:7;opacity:.9}100%{r:22;opacity:0}}
.train-line{animation:flow 1.6s linear infinite}
.head-pulse{animation:pulse 1.8s ease-out infinite}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--night-2);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline;color:var(--ink)}
.chip b{font-family:var(--mono);font-weight:500;color:var(--lamp);font-size:.76rem}
.chip:hover{border-color:var(--lamp)}
.entry{display:grid;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.entry .meta{display:flex;gap:10px;font-family:var(--mono);font-size:.74rem;color:var(--muted);flex-wrap:wrap}
.entry .meta b{color:var(--lamp-2);font-weight:500}
.entry h3{font-size:1.3rem}
.entry .vres{font-family:var(--mono);font-size:.78rem;color:var(--moss)}
.ms{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.ms li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:.9rem}
.ms li .d{font-family:var(--mono);font-size:.74rem;color:var(--muted);text-align:right;white-space:nowrap}
.ms li.done{color:var(--muted)}
.ms li.done .t{text-decoration:line-through;text-decoration-color:var(--dim)}
.ms li .ok{color:var(--moss)}
.ms li.cur{color:var(--lamp-2)}
.globe-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.globe{width:120px;height:120px;max-width:100%}
.big2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.big2 .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big2 .v{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--lamp-2);line-height:1.05;font-variant-numeric:tabular-nums}

/* ticket */
.ticket{position:relative;background:linear-gradient(180deg,var(--paper),#dccba6);color:var(--paper-ink);border-radius:8px;padding:18px 20px 14px;font-family:var(--mono);box-shadow:0 12px 30px rgba(30,42,51,.22)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--night-2);transform:translateY(-50%)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.ticket .tt{font-family:var(--display);font-weight:900;font-size:1.35rem;text-transform:uppercase;letter-spacing:.04em;color:var(--stamp)}
.ticket .row{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed #a8906a;padding-top:6px;margin-top:6px;font-size:.8rem}
.ticket .row span:first-child{color:#6c5a40;text-transform:uppercase;letter-spacing:.08em;font-size:.66rem;padding-top:2px}
.ticket .big{font-family:var(--display);font-size:2.2rem;font-weight:900;line-height:1}
.ticket .nick{font-size:1rem;font-weight:600;overflow-wrap:anywhere;text-align:right}
.ticket .stamp{position:absolute;right:16px;top:14px;border:2px solid var(--stamp);color:var(--stamp);border-radius:50%;width:60px;height:60px;display:grid;place-items:center;text-align:center;font-size:.54rem;line-height:1.2;transform:rotate(-12deg);opacity:.75;font-weight:600}
@keyframes stampin{0%{transform:rotate(-30deg) scale(2.4);opacity:0}70%{transform:rotate(-10deg) scale(.9);opacity:.9}100%{transform:rotate(-12deg) scale(1);opacity:.75}}
.ticket.fresh .stamp{animation:stampin .6s cubic-bezier(.2,.9,.3,1.2) .2s both}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--lamp-2);box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--lamp)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--night-2);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--lamp);border-color:var(--lamp);color:#1d1408;font-weight:600}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-weight:600;font-size:.9rem}
.row-f{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row-f .field{flex:1 1 140px;min-width:0}
.confirm-inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--signal)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 90px);transform:translateX(-50%);background:var(--moss);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(30,42,51,.3);max-width:calc(100% - 32px);text-align:center}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:var(--muted)}
.hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:.78rem;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:8px 14px;border-radius:999px;pointer-events:none;transition:opacity .6s;white-space:nowrap}

/* ===== ADMIN ===== */
#admin{max-width:1120px;margin:0 auto;padding-block:24px 60px}
#admin h2{font-size:clamp(2rem,6vw,3rem)}
.adm-head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px}
.adm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:860px){.adm{grid-template-columns:minmax(0,1fr)}}
.adm .card{gap:12px}
.adm .wide{grid-column:1/-1}
textarea{min-height:90px;resize:vertical}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl td,.tbl th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tblbox{overflow-x:auto}
@media (prefers-reduced-motion:reduce){.train-line,.head-pulse{animation:none}.bar>i{transition:none}.ticket.fresh .stamp{animation:none}}
</style>
</head>
<body>

<div id="game">
  <canvas id="gl" aria-label="3D vlak. Táhni do stran pro procházení vagónů, kolečkem nebo dvěma prsty přibližuj."></canvas>
  <div id="labels" aria-hidden="true"></div>

  const L=S.followers*S.wagonLength/1000;const D=peakN()*kmPer();const legs=[];let cum=0;const nodeKm={};nodeKm[S.route[0]]=0;

  if(D>=cum||!legs.length){head={leg:null,t:1,node:S.route[S.route.length-1],waiting:true,over:D-cum}}

function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function typoSuggestions(){
  if(!LAST_EXPORT.length)return[];const have=new Set(ADMIN_TICKETS.map(t=>t.nick));const free=LAST_EXPORT.filter(n=>!have.has(n));
  const nm=n=>n.replace(/[._]/g,"");const out=[];
  for(const t of ADMIN_TICKETS){if(t.status!=="pending")continue;const a=nm(t.nick);let best=null,score=1e9;
    for(const f of free){const b=nm(f);let sc;if(a===b)sc=0;else if(a.length>=4&&(b.startsWith(a)||a.startsWith(b)))sc=1+Math.abs(a.length-b.length)/10;else{const d=lev(a,b);sc=d<=2&&Math.min(a.length,b.length)>=5?1+d:1e9}
      if(sc<score){score=sc;best=f}}
    if(best&&score<1e9)out.push({nick:t.nick,to:best,sure:score===0})}
  return out.sort((x,y)=>(y.sure-x.sure));
}

const okNick=n=>/^[a-z0-9._]{1,30}$/.test(n)&&!/^\./.test(n)&&!/\.$/.test(n);
function hrefNick(h){try{const parts=new URL(h).pathname.split("/").filter(x=>x&&x!=="_u");return parts[parts.length-1]||""}catch(e){return ""}}
function parseFollowers(files){
  const out=new Map(),warn=[];
  const add=(n,ts)=>{n=String(n||"").trim().replace(/^@+/,"").toLowerCase();if(!okNick(n))return 0;if(!out.has(n))out.set(n,+ts||0);return 1};
  for(const {name,text} of files){
    const t=(text||"").trim();let found=0;
    if(/following/i.test(name)&&!/followers/i.test(name)){warn.push(`${name} je seznam lidí, které sleduješ ty. Přeskočil jsem ho.`);continue}
    if(t.startsWith("{")||t.startsWith("[")){
      let j;try{j=JSON.parse(t)}catch(e){warn.push(`${name} nejde přečíst jako JSON.`);continue}
      if(j&&!Array.isArray(j)&&j.relationships_following){warn.push(`${name} je seznam lidí, které sleduješ ty. Přeskočil jsem ho.`);continue}
      const walk=o=>{if(Array.isArray(o)){o.forEach(walk);return}if(!o||typeof o!=="object")return;
        if(Array.isArray(o.string_list_data)){for(const d of o.string_list_data)found+=add(d.value||o.title||hrefNick(d.href||""),d.timestamp);return}
        Object.values(o).forEach(walk)};
      walk(j);
    }else if(/<a\s/i.test(t)){for(const m of t.matchAll(/href="https?:\/\/(?:www\.)?instagram\.com\/(?:_u\/)?([A-Za-z0-9._]+)\/?"/g))found+=add(m[1],0)}
    else{for(const line of t.split(/\r?\n/))found+=add(line.split(/[\s,;]+/)[0],0)}
    if(!found)warn.push(`V ${name} jsem nenašel žádné nicky.`);
  }
  return {map:out,warn};
}

      <div class="row-f"><div class="field"><label for="aDl">Hlasuje se do</label><input type="text" id="aDl" value="${esc(v.deadline||"")}" placeholder="neděle 2. 11. ve 20:00"></div><button class="btn" id="aVSave" type="button">Uložit hlasy</button></div>
      ${ONLINE?igVoteHtml():""}
      <p class="muted" style="font-size:.85rem">„Poslat sem“ uzavře hlasování, zapíše výsledek do kroniky a otevře další výhybku.</p>
      ${S.route.length>1?`<span id="undoWrap"><button class="btn small danger" id="aUndo" type="button">Vrátit poslední úsek trasy</button></span>`:""}
    </div>
    <div class="card"><h3>Zapsat zastávku do kroniky</h3>
      <div class="row-f"><div class="field"><label for="cNode">Stanice</label><select id="cNode">${S.route.map(id=>`<option value="${id}"${id===I.cur?" selected":""}>${esc(nodeName(id))}</option>`).join("")}</select></div><div class="field"><label for="cDate">Datum</label><input type="date" id="cDate" value="${new Date().toISOString().slice(0,10)}"></div></div>
      <div class="field"><label for="cTitle">Titulek</label><input type="text" id="cTitle" placeholder="Pardubice: perníková mlha"></div>
      <div class="field"><label for="cText">Co se tam stalo</label><textarea id="cText"></textarea></div>
      <div class="field"><label for="cTask">Úkol pro cestující (nepovinné)</label><input type="text" id="cTask"></div>
      <div class="err" id="cErr"></div><button class="btn primary" id="cAdd" type="button">Přidat do kroniky</button>
      <div class="tblbox"><table class="tbl"><tbody>${S.chronicle.map((c,i)=>`<tr><td class="num" style="white-space:nowrap">${esc(fmtDate(c.date))}</td><td><b>${esc(c.title)}</b><br><span class="muted">${esc(nodeName(c.node))}</span></td><td><button class="btn small danger" type="button" data-cdel="${i}">Smazat</button></td></tr>`).join("")}</tbody></table></div>
    </div>
    <div class="card"><h3>Speciální vagóny</h3>
      <div class="row-f"><div class="field"><label for="sW">Vagón č.</label><input type="number" id="sW" min="1" value="${sv.wagon}"></div><button class="btn small" id="sWSave" type="button">Uložit číslo</button></div>
      <div class="tblbox"><table class="tbl"><thead><tr><th>Možnost</th><th>Hlasy</th><th></th></tr></thead><tbody>
      ${(sv.options||[]).map((o,i)=>`<tr><td>${esc(o.label)}</td><td><input type="number" min="0" value="${+o.votes||0}" data-sv="${i}" style="width:100px" aria-label="Hlasy pro ${esc(o.label)}"></td><td style="white-space:nowrap"><button class="btn small" type="button" data-swin="${i}">Vyhrál</button> <button class="btn small danger" type="button" data-sdel="${i}" aria-label="Odebrat">×</button></td></tr>`).join("")}
      </tbody></table></div>
      <div class="row-f"><div class="field"><label for="sNew">Nová možnost</label><input type="text" id="sNew" placeholder="Vagón plný ozvěn"></div><button class="btn small" id="sAdd" type="button">Přidat</button><button class="btn small" id="sSave" type="button">Uložit hlasy</button></div>
      <p class="muted" style="font-size:.85rem">Připojené: ${S.specials.map(s=>`№ ${fmt(s.wagon)} ${esc(s.name)}`).join(" · ")||"zatím žádné"}</p>
    </div>
    <div class="card"><h3>Přidat stanici na mapu</h3>
      <p class="muted" style="font-size:.88rem">Když vlak dojede na okraj mapy, přidej další stanici. Souřadnice najdeš na mapy.cz (pravý klik).</p>
      <div class="field"><label for="nName">Název</label><input type="text" id="nName" placeholder="Berlín"></div>
      <div class="row-f"><div class="field"><label for="nFrom">Napojit na</label><select id="nFrom">${nodeOpts(S.route[S.route.length-1])}</select></div><div class="field"><label for="nKm">Km po trati</label><input type="number" id="nKm" min="1"></div></div>
      <div class="row-f"><div class="field"><label for="nLat">Zeměpisná šířka</label><input type="text" id="nLat" placeholder="52.52"></div><div class="field"><label for="nLon">Zeměpisná délka</label><input type="text" id="nLon" placeholder="13.40"></div></div>
      <div class="err" id="nErr"></div><button class="btn" id="nAdd" type="button">Přidat stanici</button>
    </div>
    ${ticketsCardHtml()}
    <div class="card wide"><h3>${ONLINE?"Záloha dat":"Data webu"}</h3>
      <p class="muted" style="font-size:.9rem">${ONLINE?"Celý stav vlaku bez jízdenek. Zkopíruj si ho jako zálohu. Když sem vložíš upravená data a dáš Načíst, uloží se na web.":"Celý stav vlaku. Zkopíruj ho a ulož jako <code>data.json</code> do repozitáře na GitHubu."}</p>
      <textarea id="dJson" spellcheck="false" style="min-height:180px;font-family:var(--mono);font-size:.78rem">${esc(JSON.stringify((({tickets,...r})=>ONLINE?r:S)(S),null,2))}</textarea>
      <div class="row-f"><button class="btn primary" id="dCopy" type="button">Zkopírovat data</button><button class="btn" id="dLoad" type="button">Načíst vložená data</button>${ONLINE?"":`<span id="resetWrap"><button class="btn danger" id="dReset" type="button">Zahodit změny</button></span>`}</div>
      <div class="err" id="dErr"></div>
    </div>
  </div>`;
  bindAdmin();
}
function bindAdmin(){
  const A=$("#admin");
  $("#aFSave").onclick=()=>{const v=Math.max(0,parseInt($("#aF").value,10)||0);if(ONLINE){S.igFollowers=v;save("Počet followerů uložen")}else{S.followers=v;save("Počet cestujících uložen")}};
  $("#aLenSave").onclick=()=>{S.wagonLength=Math.max(1,+$("#aLen").value||25);S.specialEvery=Math.max(1,+$("#aEvery").value||500);S.kmPerPassenger=Math.max(.01,+$("#aKm").value||1);save("Uloženo")};
  $("#aIgSave").onclick=()=>{S.instagram=$("#aIg").value.trim().replace(/^@/,"");save("Účet uložen")};
  const readVotes=()=>{if(!S.vote)return;A.querySelectorAll("[data-vv]").forEach(i=>{S.vote.options[+i.dataset.vv].votes=Math.max(0,+i.value||0)});S.vote.deadline=$("#aDl").value.trim()};
  $("#aVSave").onclick=()=>{readVotes();save("Hlasy uloženy")};
  $("#aVAddBtn").onclick=()=>{const to=$("#aVAdd").value;if(!to)return;if(!S.vote)S.vote={at:S.route[S.route.length-1],options:[],deadline:""};readVotes();S.vote.options.push({to,votes:0});save("Směr přidán")};
  A.querySelectorAll("[data-vdel]").forEach(b=>b.onclick=()=>{readVotes();S.vote.options.splice(+b.dataset.vdel,1);save("Směr odebrán")});
  A.querySelectorAll("[data-decide]").forEach(b=>b.onclick=()=>{readVotes();const to=b.dataset.decide,at=S.vote.at;const tot=S.vote.options.reduce((s,o)=>s+(+o.votes||0),0)||1;
    const res=S.vote.options.map(o=>`${nodeName(o.to)} ${Math.round((+o.votes||0)/tot*100)} %`).join(" · ");const ent=[...S.chronicle].reverse().find(c=>c.node===at);
    if(ent)ent.voteResult=res;else S.chronicle.push({node:at,date:new Date().toISOString().slice(0,10),title:`${nodeName(at)}: výhybka rozhodnuta`,text:`Cestující poslali vlak směr ${nodeName(to)}.`,task:"",voteResult:res});
    const p=pathTo(at,to);if(!p){toast("K tomuhle cíli nevede volná trať.");return}
    S.route.push(...p.path.slice(1));S.vote={at:to,deadline:"",options:[]};save(`Vlak jede do: ${nodeName(to)}${p.path.length>2?` (přes ${p.path.length-2} stanic)`:""}. Přidej nové cíle hlasování.`)});
  const u=$("#aUndo");if(u)u.onclick=()=>{$("#undoWrap").innerHTML=`<span class="confirm-inline">Vrátit úsek do ${esc(nodeName(S.route[S.route.length-1]))}? <button class="btn small danger" id="uYes" type="button">Vrátit</button><button class="btn small" id="uNo" type="button">Ne</button></span>`;
    $("#uYes").onclick=()=>{const gone=S.route.pop();const at=S.route[S.route.length-1];S.vote={at,deadline:"",options:neighbors(at).filter(n=>!S.route.includes(n)).map(n=>({to:n,votes:0}))};save(`Úsek do ${nodeName(gone)} vrácen`)};$("#uNo").onclick=renderAdmin};
  $("#cAdd").onclick=()=>{const t=$("#cTitle").value.trim(),x=$("#cText").value.trim();if(!t||!x){$("#cErr").textContent="Doplň titulek i text.";return}S.chronicle.push({node:$("#cNode").value,date:$("#cDate").value,title:t,text:x,task:$("#cTask").value.trim(),voteResult:""});save("Zastávka zapsána do kroniky")};
  A.querySelectorAll("[data-cdel]").forEach(b=>b.onclick=()=>{S.chronicle.splice(+b.dataset.cdel,1);save("Záznam smazán")});
  if(!S.specialVote)S.specialVote={wagon:S.specialEvery,options:[]};
  const readSV=()=>{A.querySelectorAll("[data-sv]").forEach(i=>{S.specialVote.options[+i.dataset.sv].votes=Math.max(0,+i.value||0)})};
  $("#sWSave").onclick=()=>{readSV();S.specialVote.wagon=Math.max(1,+$("#sW").value||S.specialEvery);save("Uloženo")};
  $("#sSave").onclick=()=>{readSV();save("Hlasy uloženy")};
  $("#sAdd").onclick=()=>{const l=$("#sNew").value.trim();if(!l)return;readSV();S.specialVote.options.push({label:l,votes:0});save("Možnost přidána")};
  A.querySelectorAll("[data-sdel]").forEach(b=>b.onclick=()=>{readSV();S.specialVote.options.splice(+b.dataset.sdel,1);save("Odebráno")});
  A.querySelectorAll("[data-swin]").forEach(b=>b.onclick=()=>{readSV();const o=S.specialVote.options[+b.dataset.swin];const w=S.specialVote.wagon;S.specials=S.specials.filter(s=>s.wagon!==w);S.specials.push({wagon:w,name:o.label});S.specialVote={wagon:w+S.specialEvery,options:[]};save(`Vagón № ${fmt(w)}: ${o.label}`)});
  $("#nAdd").onclick=()=>{const name=$("#nName").value.trim(),from=$("#nFrom").value,km=+$("#nKm").value,lat=parseFloat($("#nLat").value.replace(",",".")),lon=parseFloat($("#nLon").value.replace(",","."));
    if(!name||!km||isNaN(lat)||isNaN(lon)){$("#nErr").textContent="Vyplň název, kilometry a obě souřadnice.";return}
    let id=name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"")||"st";while(S.nodes[id])id+="2";
    S.nodes[id]={name,lon,lat,lab:"r"};S.edges.push([from,id,km]);if(S.vote&&S.vote.at===from&&!S.route.includes(id))S.vote.options.push({to:id,votes:0});save(`Stanice ${name} přidána`)};
  bindTickets(A);bindCheck(A);bindDriver(A);bindTypos(A);bindIg(A);
  const lo=$("#aLogout");if(lo)lo.onclick=()=>{adminLogout();toast("Odhlášeno")};
  $("#dCopy").onclick=()=>{const ta=$("#dJson");const txt=JSON.stringify(S,null,2);const fb=()=>{ta.focus();ta.select();toast("Označeno, zkopíruj Ctrl+C")};if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Data zkopírována"),fb);else fb()};
  $("#dLoad").onclick=()=>{try{const d=JSON.parse($("#dJson").value);if(!d.nodes||!d.route||typeof d.followers!=="number")throw 0;S=d;save("Data načtena")}catch(e){$("#dErr").textContent="Tohle nejsou platná data vlaku. Zkontroluj, že je vložený celý JSON."}};
  const dr=$("#dReset");if(dr)dr.onclick=()=>{$("#resetWrap").innerHTML=`<span class="confirm-inline">Zahodit všechny změny? <button class="btn small danger" id="rYes" type="button">Zahodit</button><button class="btn small" id="rNo" type="button">Ne</button></span>`;
    $("#rYes").onclick=()=>{lsDel(KEY);localDraft=false;S=clone(BASE);renderAll();toast("Změny zahozeny")};$("#rNo").onclick=renderAdmin};
}

/* ================= ROUTER ================= */
function renderAll(){
  if(location.hash==="#sprava"){renderAdmin();return}
  renderHud();Game.setN(wagonCount());Game.refreshWagon();
  if(openKey&&SHEETS[openKey]&&openKey!=="sdilet")SHEETS[openKey].r($("#sheetBody"));
}
function route(){
  const h=location.hash.slice(1);const adm=h==="sprava";
  document.body.classList.toggle("game",!adm);$("#game").hidden=adm;$("#admin").hidden=!adm;Game.setActive(!adm);
  if(adm){if(ONLINE&&ADMIN_PW){$("#admin").innerHTML=`<p class="muted" style="padding:40px 0">Načítám…</p>`;adminLoad().then(renderAdmin).catch(e=>{if(e.status===401)adminLogout();else{renderAdmin();toast(e.message)}})}else renderAdmin();window.scrollTo(0,0);return}
  renderHud();Game.setN(wagonCount());
  if(SHEETS[h])openSheet(h);
}
window.addEventListener("hashchange",route);
async function loadWorld(){
  const r=await fetch("/api/world",{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();
  if(!d||!d.online||!d.state||!d.state.nodes)throw 0;return d;
}
async function init(){
  {const m=location.hash.match(/^#j=([a-z0-9._]{1,30})~([A-Za-z0-9_-]{10,})$/);if(m){PENDING_TRANSFER={nick:m[1],token:m[2]};history.replaceState(null,"",location.pathname+location.search);try{sessionStorage.setItem(SEENKEY,"1")}catch(e){}}}
  try{const d=await loadWorld();ONLINE=true;BASE=d.state;setRoster(d.roster);COUNTS=d.counts;DRIVER=d.driver||null;HIDDEN=new Set(d.hidden||[]);RECOVERING=!!d.recovering}catch(e){}
  // na zveřejněném webu bez spojení se serverem neukazovat ukázku, ale technickou přestávku
  window.DOWN=!ONLINE&&/vercel\.app$/.test(location.hostname);
  if(DOWN){const b=document.createElement("div");b.setAttribute("role","status");b.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:200;background:#1e2a33;color:#fff;border-radius:16px;padding:14px 18px;font:600 15px/1.4 system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center";b.innerHTML="🔧 Vlak má krátkou technickou přestávku. Jízdenky i vagóny jsou v bezpečí. Za chvíli jedeme dál!";document.body.appendChild(b)}
  if(!ONLINE){try{const r=await fetch("data.json",{cache:"no-store"});if(r.ok){const d=await r.json();if(d&&d.nodes&&d.route)BASE=d}}catch(e){}}
  const draft=ONLINE?null:lsGet(KEY);if(draft){try{S=JSON.parse(draft);localDraft=true}catch(e){S=clone(BASE)}}else S=clone(BASE);
  if(ONLINE){try{ADMIN_PW=sessionStorage.getItem(ADMKEY)}catch(e){}}
  loadMy();if(ONLINE&&myTicket&&!myTicket.token)myTicket=null;route();if(Game.ok)Game.setDriver(DRIVER);if(PENDING_TRANSFER)applyTransfer();else refreshMy();
  if(ONLINE)setInterval(async()=>{if(document.hidden||location.hash==="#sprava")return;try{const d=await loadWorld();const before=JSON.stringify(ROSTER);S=d.state;setRoster(d.roster);COUNTS=d.counts;DRIVER=d.driver||null;HIDDEN=new Set(d.hidden||[]);if(Game.ok)Game.setDriver(DRIVER);renderHud();Game.setN(wagonCount());if(JSON.stringify(ROSTER)!==before)Game.refreshWagon()}catch(e){}},30000);
  const h=location.hash.slice(1);
  let seen=false;try{seen=sessionStorage.getItem(SEENKEY)==="1"}catch(e){}
  if(h!=="sprava"&&!SHEETS[h]&&!seen)openBoarding();
  if(Game.ok&&h!=="sprava")Game.flyTo(myTicket&&myTicket.wagon?Math.max(3,Math.min(wagonCount(),myTicket.wagon)):Math.min(4,wagonCount()),.8);
}
init();
</script>

</body>
